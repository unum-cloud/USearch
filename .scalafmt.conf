# Matches the 120 columns every other language in the tree wraps at.
version = 3.8.3
runner.dialect = scala3
maxColumn = 120

# Javadoc's leading asterisk, like the Java and Kotlin sources beside it, and no reflowing: prose
# here is one sentence per line and stays that way.
docstrings.style = Asterisk
docstrings.wrap = no
docstrings.oneline = keep
