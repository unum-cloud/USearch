name: Pre-Release

on:
  pull_request:
    branches: ["main", "main-dev"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# `actions: read` lets the Swift Android job, which runs in another repository's workflow, download this run's artifacts.
permissions:
  actions: read
  contents: read

jobs:
  hooks:
    name: Check Commits
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check Every Commit
        run: .github/scripts/check-commits.sh "${{ github.event.pull_request.base.sha }}"

  test_c:
    name: Test C
    needs: hooks
    uses: ./.github/workflows/test-c.yml

  test_python:
    name: Test Python
    needs: hooks
    uses: ./.github/workflows/test-python.yml

  test_rust:
    name: Test Rust
    needs: hooks
    uses: ./.github/workflows/test-rust.yml

  test_javascript:
    name: Test JavaScript
    needs: hooks
    uses: ./.github/workflows/test-javascript.yml

  test_swift:
    name: Test Swift
    needs: hooks
    uses: ./.github/workflows/test-swift.yml

  test_go:
    name: Test Go
    needs: hooks
    uses: ./.github/workflows/test-go.yml

  test_java:
    name: Test Java
    needs: hooks
    uses: ./.github/workflows/test-java.yml

  test_csharp:
    name: Test C#
    needs: hooks
    uses: ./.github/workflows/test-csharp.yml

  test_docs:
    name: Test Docs
    needs: hooks
    uses: ./.github/workflows/test-docs.yml
