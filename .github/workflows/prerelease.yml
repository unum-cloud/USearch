name: Pre-Release

on:
  push:
    branches: ["main-dev"]
  pull_request:
    branches: ["main-dev"]

env:
  GH_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
  PYTHONUTF8: 1
  PYTHONFAULTHANDLER: 1
  PYTHON_VERSION: 3.12
  DOTNET_VERSION: 10.0.x
  NODE_VERSION: 22
  JAVA_VERSION: 25
  GO_VERSION: "^1.22.0"
  ANDROID_NDK_VERSION: 30.0.16248370
  ANDROID_SDK_VERSION: 21
  EMSCRIPTEN_VERSION: 6.0.9
  WASI_SDK_VERSION: "34"
  WASMTIME_VERSION: v48.0.2
  SWIFT_VERSION: 6.4.0

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages; the Swift Android job downloads this run's
# artifacts through `gh`, which needs `actions: read`.
permissions:
  contents: read
  actions: read

jobs:
  versioning:
    name: Update Version
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run TinySemVer
        uses: ashvardanian/tinysemver@v3
        with:
          verbose: "true"
          version-file: "VERSION"
          update-version-in: |
            package.json:"version": "(\d+\.\d+\.\d+(?:-rc\.\d+)?)"
            CITATION.cff:^version: (\d+\.\d+\.\d+(?:-rc\.\d+)?)
            Cargo.toml:^version = "(\d+\.\d+\.\d+(?:-rc\.\d+)?)"
            conanfile.py:version = "(\d+\.\d+\.\d+(?:-rc\.\d+)?)"
            java/README.md:usearchVersion = '(\d+\.\d+\.\d+(?:-rc\.\d+)?)'
            java/README.md:version: '(\d+\.\d+\.\d+(?:-rc\.\d+)?)'
            README.md:version = {(\d+\.\d+\.\d+(?:-rc\.\d+)?)}
            csharp/nuget/nuget-package.props:>(\d+\.\d+\.\d+(?:-rc\.\d+)?)</Version>
            CMakeLists.txt:VERSION (\d+\.\d+\.\d+(?:-rc\.\d+)?)
          update-major-version-in: |
            c/usearch/types.h:^#define USEARCH_VERSION_MAJOR (\d+)
          update-minor-version-in: |
            c/usearch/types.h:^#define USEARCH_VERSION_MINOR (\d+)
          update-patch-version-in: |
            c/usearch/types.h:^#define USEARCH_VERSION_PATCH (\d+)
          dry-run: "true"

  test_ubuntu_gcc:
    name: Test on Ubuntu with GCC 14
    runs-on: ubuntu-26.04
    env:
      CC: gcc-14
      CXX: g++-14

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Pull Git submodules
        run: git submodule update --init --recursive

        # C/C++
      - name: Build C/C++
        run: |
          sudo apt update
          sudo apt install -y build-essential g++-14 lld libjemalloc-dev libomp-dev
          cmake --preset relwithdebinfo -D CMAKE_C_COMPILER=gcc-14 -D CMAKE_CXX_COMPILER=g++-14 -D USEARCH_BUILD_SHARED=1 -D USEARCH_WITH_JEMALLOC=1
          cmake --build --preset relwithdebinfo
      - name: Test C and C++
        run: ctest --preset relwithdebinfo

        # Python
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group test .
      - name: Test Python
        run: python -X faulthandler -m pytest -x

        # JavaScript
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: npm install --skip-scripts
      - name: Build JavaScript
        run: npm run build-js
      - name: Test JavaScript
        run: npm test

        # Rust
      - name: Set up Rust
        run: |
          rustup update nightly
          rustup default nightly
          rustup component add clippy
      - name: Lint Rust
        run: cargo clippy --all-targets -- -D warnings
      - name: Build Rust
        run: cargo build
      - name: Test Rust
        run: cargo test

        # Java
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "adopt"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Check Java, Kotlin & Scala formatting
        run: gradle spotlessCheck
      - name: Test Java
        run: gradle clean build
      # The Java surface is what Kotlin and Scala consume, so both compile against it and run here:
      # `@NullMarked` only reaches a Kotlin caller if it survives compilation, and nothing else in
      # the matrix would notice if it stopped.
      - name: Test Java from Kotlin & Scala
        run: gradle kotlinInteropTest scalaInteropTest

        # C#
      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Test .NET
        run: |
          mkdir -p "${{ github.workspace }}/csharp/lib/runtimes/linux-x64/native"
          cp "${{ github.workspace }}/build_relwithdebinfo/libusearch_shared.so" "${{ github.workspace }}/csharp/lib/runtimes/linux-x64/native"
          dotnet test -c Debug --logger "console;verbosity=detailed"
        shell: bash
        working-directory: ${{ github.workspace }}/csharp

        # GoLang
      - name: Test GoLang
        run: |
          sudo cp ${{ github.workspace }}/build_relwithdebinfo/libusearch_shared.so /usr/lib/libusearch_shared.so
          for root in c include cpp; do sudo cp -r ${{ github.workspace }}/$root/usearch /usr/include/; done
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race -v ./...
        working-directory: ${{ github.workspace }}/golang/

  test_ubuntu_debug:
    name: Test Debug build on Ubuntu
    runs-on: ubuntu-26.04
    env:
      CC: gcc
      CXX: g++

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Pull Git submodules
        run: git submodule update --init --recursive
      - name: Build C/C++ with asserts
        run: |
          sudo apt update
          sudo apt install -y build-essential lld libjemalloc-dev libomp-dev
          cmake --preset debug -D CMAKE_C_COMPILER=gcc -D CMAKE_CXX_COMPILER=g++
          cmake --build --preset debug
      - name: Test C/C++
        run: ctest --preset debug

  verify_models:
    name: Check Promela Models and GenMC Clients
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Pull Git submodules
        run: git submodule update --init --recursive
      - name: Install Spin, Clang and the GenMC build dependencies
        run: |
          sudo apt update
          sudo apt install -y spin cmake clang-20 llvm-20-dev libffi-dev zlib1g-dev libedit-dev
      - name: Checkout GenMC
        uses: actions/checkout@v7
        with:
          repository: MPI-SWS/genmc
          ref: 9f6c4c0772d0c42b325681581acc6a0f3eb9b5f7
          path: genmc
      - name: Restore the GenMC build
        id: genmc
        uses: actions/cache@v6
        with:
          path: genmc/build
          key: genmc-9f6c4c0-clang-20
      - name: Build GenMC
        if: steps.genmc.outputs.cache-hit != 'true'
        run: |
          cmake -S genmc -B genmc/build -D CMAKE_BUILD_TYPE=Release -D CMAKE_C_COMPILER=clang-20 -D CMAKE_CXX_COMPILER=clang++-20 -D LLVM_DIR=/usr/lib/llvm-20/lib/cmake/llvm
          cmake --build genmc/build --parallel
      - name: Check the models and the clients
        run: verification/check.sh
        env:
          GENMC: ${{ github.workspace }}/genmc/build/bin/genmc
          GENMC_CLANG: clang++-20

  test_ubuntu_clang:
    name: Test on Ubuntu with Clang 20
    runs-on: ubuntu-26.04
    env:
      CC: clang-20
      CXX: clang++-20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Pull Git submodules
        run: git submodule update --init --recursive

        # C/C++
      - name: Build C/C++
        run: |
          sudo apt update
          sudo apt install -y build-essential clang-20 lld libjemalloc-dev
          cmake --preset relwithdebinfo -D CMAKE_C_COMPILER=clang-20 -D CMAKE_CXX_COMPILER=clang++-20 -D USEARCH_BUILD_SHARED=1 -D USEARCH_WITH_JEMALLOC=1
          cmake --build --preset relwithdebinfo
      - name: Test C and C++
        run: ctest --preset relwithdebinfo

        # JavaScript
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: npm install --skip-scripts
      - name: Build JavaScript
        run: npm run build-js
      - name: Test JavaScript
        run: npm test

        # Python
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group test .
        env:
          CXX: clang++
          CC: clang++ # Override the default compiler
      - name: Test Python
        run: python -X faulthandler -m pytest -x

        # Rust
      - name: Set up Rust
        run: |
          rustup update nightly
          rustup default nightly
      - name: Build Rust
        run: cargo build
      - name: Test Rust
        run: cargo test

        # C#
      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Test .NET
        run: |
          mkdir -p "${{ github.workspace }}/csharp/lib/runtimes/linux-x64/native"
          cp "${{ github.workspace }}/build_relwithdebinfo/libusearch_shared.so" "${{ github.workspace }}/csharp/lib/runtimes/linux-x64/native"
          dotnet test -c Debug --logger "console;verbosity=detailed"
        shell: bash
        working-directory: ${{ github.workspace }}/csharp

  test_macos:
    name: macOS
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Pull Git submodules
        run: git submodule update --init --recursive

        # C/C++
      - name: Build C/C++
        run: |
          # Apple's linker is fast already; the preset's `lld` stands in for GNU `ld` on Linux
          cmake --preset relwithdebinfo -D USEARCH_BUILD_SHARED=1 -D CMAKE_EXE_LINKER_FLAGS= -D CMAKE_SHARED_LINKER_FLAGS=
          cmake --build --preset relwithdebinfo
      - name: Test C and C++
        run: ctest --preset relwithdebinfo

        # JavaScript
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: npm install --skip-scripts
      - name: Build JavaScript
        run: npm run build-js
      - name: Test JavaScript
        run: npm test

        # Python
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group test .
        env:
          CXX: clang++
          CC: clang++ # Override the default compiler
      - name: Test Python
        run: python -X faulthandler -m pytest -x

        # Rust
      - name: Set up Rust
        run: |
          rustup update nightly
          rustup default nightly
      - name: Build Rust
        run: cargo build
      - name: Test Rust
        run: cargo test

        # C#
      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Test .NET
        run: |
          mkdir -p "${{ github.workspace }}/csharp/lib/runtimes/osx-arm64/native"
          cp "${{ github.workspace }}/build_relwithdebinfo/libusearch_shared.dylib" "${{ github.workspace }}/csharp/lib/runtimes/osx-arm64/native"
          dotnet test -c Debug --logger "console;verbosity=minimal" --filter "FullyQualifiedName!=Cloud.Unum.USearch.Tests.UsearchIndexTests.PersistAndRestore"
        shell: bash
        working-directory: ${{ github.workspace }}/csharp

  # Both packages link the host's slice their own `swift` presets build, as a release would ship it.
  test_swift_macos:
    name: Swift on macOS
    runs-on: xcode-27
    env:
      USEARCH_SWIFT_ARTIFACT: build_swift/USearchC.xcframework
      NUMKONG_SWIFT_ARTIFACT: build_swift/NumKongC.xcframework
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Pull Git submodules
        run: git submodule update --init --recursive
      - name: Build NumKong XCFramework
        working-directory: numkong
        run: |
          cmake --preset swift
          cmake --build --preset swift
      - name: Build XCFramework
        run: |
          cmake --preset swift
          cmake --build --preset swift
      - name: Test Swift
        run: swift test

  test_swift_linux:
    name: Swift on Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    container: swift:6.4
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    env:
      USEARCH_SWIFT_ARTIFACT: build_swift/USearchC.artifactbundle
      NUMKONG_SWIFT_ARTIFACT: build_swift/NumKongC.artifactbundle
    steps:
      - name: Install CMake
        run: apt-get update && apt-get install -y cmake ninja-build
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Build NumKong Artifact Bundle
        working-directory: numkong
        run: |
          cmake --preset swift -D CMAKE_C_COMPILER=clang -D CMAKE_CXX_COMPILER=clang++
          cmake --build --preset swift
      - name: Build Artifact Bundle
        run: |
          cmake --preset swift -D CMAKE_C_COMPILER=clang -D CMAKE_CXX_COMPILER=clang++
          cmake --build --preset swift
      - name: Test Swift
        run: swift test

  # Swift on Windows links the MSVC ABI, so both archives come from `cl`, which only a developer prompt puts on the
  # `PATH` for the Ninja generator the presets pick.
  test_swift_windows:
    name: Swift on Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.arch == 'arm64' && 'windows-11-arm' || 'windows-2025' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    env:
      USEARCH_SWIFT_ARTIFACT: build_swift/USearchC.artifactbundle
      NUMKONG_SWIFT_ARTIFACT: build_swift/NumKongC.artifactbundle
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set Up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch == 'arm64' && 'arm64' || 'x64' }}
      - name: Build NumKong Artifact Bundle
        working-directory: numkong
        run: |
          cmake --preset swift -D CMAKE_C_COMPILER=cl -D CMAKE_CXX_COMPILER=cl
          cmake --build --preset swift
      - name: Build Artifact Bundle
        run: |
          cmake --preset swift -D CMAKE_C_COMPILER=cl -D CMAKE_CXX_COMPILER=cl -D USEARCH_SWIFT_TRIPLES=${{ matrix.arch == 'arm64' && 'aarch64' || 'x86_64' }}-unknown-windows-msvc
          cmake --build --preset swift
      - name: Set Up Swift
        uses: compnerd/gha-setup-swift@v0.5.0
        with:
          swift-version: swift-${{ env.SWIFT_VERSION }}-release
          swift-build: ${{ env.SWIFT_VERSION }}-RELEASE
          build_arch: ${{ matrix.arch }}
      - name: Test Swift
        run: swift test

  # One archive per ABI at the Swift SDK's lowest API level, serving every level the SDK names, built here because the
  # reusable workflow below runs in a container without the NDK.
  build_swift_android:
    name: Build Swift Artifact Bundles for Android
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install NDK
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${{ env.ANDROID_NDK_VERSION }}"
      - name: Build Artifact Bundles
        run: |
          set -euo pipefail
          toolchain="${ANDROID_HOME}/ndk/${{ env.ANDROID_NDK_VERSION }}/build/cmake/android.toolchain.cmake"
          abi() {
            local abi=$1 arch=$2
            local triples
            triples="$(seq -f "$arch-unknown-linux-android%g" -s ';' 23 36)"
            (cd numkong && cmake -S . -B "build_$abi" --preset swift -D NUMKONG_SWIFT_DIRECTORY="$PWD/build_swift" \
              -D CMAKE_TOOLCHAIN_FILE="$toolchain" -D ANDROID_ABI="$abi" -D ANDROID_PLATFORM=android-23 \
              -D NUMKONG_SWIFT_TRIPLES="$triples" && cmake --build "build_$abi")
            cmake -S . -B "build_$abi" --preset swift -D USEARCH_SWIFT_DIRECTORY="$PWD/build_swift" \
              -D CMAKE_TOOLCHAIN_FILE="$toolchain" -D ANDROID_ABI="$abi" -D ANDROID_PLATFORM=android-23 \
              -D USEARCH_SWIFT_TRIPLES="$triples"
            cmake --build "build_$abi"
          }
          abi arm64-v8a aarch64
          abi armeabi-v7a armv7
          abi x86_64 x86_64
      - name: Upload Artifact Bundles
        uses: actions/upload-artifact@v7
        with:
          name: swift-android
          path: |
            build_swift/USearchC.artifactbundle
            numkong/build_swift/NumKongC.artifactbundle
          if-no-files-found: error
          retention-days: 1

  # The reusable workflow runs in another repository, so it fetches the artifact bundles through `gh`, with the token
  # and the `actions: read` permission this workflow grants.
  test_swift_android:
    name: Swift on Android
    needs: build_swift_android
    uses: swiftlang/github-workflows/.github/workflows/swift_package_test.yml@fa1e46cf0f07ffde2de131e9ed5bd66a488c289c # main
    with:
      enable_linux_checks: false
      enable_windows_checks: false
      enable_android_sdk_build: true
      enable_android_sdk_checks: true
      needs_token: true
      linux_env_vars: |
        USEARCH_SWIFT_ARTIFACT=build_swift/USearchC.artifactbundle
        NUMKONG_SWIFT_ARTIFACT=build_swift/NumKongC.artifactbundle
      android_sdk_pre_build_command: git submodule update --init --recursive && gh run download ${{ github.run_id }} --repo ${{ github.repository }} --name swift-android
      android_sdk_versions: '["6.4"]'

  # Strict SIMD128, which every SIMD engine validates, as one archive serves every Swift WASI module.
  test_swift_wasm:
    name: Swift on WebAssembly WASI
    runs-on: ubuntu-26.04
    container: swift:6.4
    env:
      USEARCH_SWIFT_ARTIFACT: build_swift/USearchC.artifactbundle
      NUMKONG_SWIFT_ARTIFACT: build_swift/NumKongC.artifactbundle
    steps:
      - name: Install CMake and Wasmtime
        run: |
          apt-get update && apt-get install -y cmake ninja-build curl xz-utils
          curl -fsSL https://wasmtime.dev/install.sh | bash -s -- --version "$WASMTIME_VERSION"
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install WASI SDK and Swift SDK for WebAssembly
        run: |
          curl -sSL "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_VERSION}/wasi-sdk-${WASI_SDK_VERSION}.0-x86_64-linux.tar.gz" \
            | tar xz -C "$HOME"
          echo "WASI_SDK_PATH=$HOME/wasi-sdk-${WASI_SDK_VERSION}.0-x86_64-linux" >> "$GITHUB_ENV"
          swift sdk install "https://download.swift.org/swift-${SWIFT_VERSION}-release/wasm-sdk/swift-${SWIFT_VERSION}-RELEASE/swift-${SWIFT_VERSION}-RELEASE_wasm.artifactbundle.tar.gz" --checksum f07b7be3c586d92d7a07051fc6d303b87ebea67eadc40640ba59d5a8b79aa86d
      - name: Build NumKong Artifact Bundle
        working-directory: numkong
        run: |
          cmake --preset swift -D CMAKE_TOOLCHAIN_FILE=cmake/toolchain-wasm32-wasi.cmake -D NUMKONG_TARGET_ARCH=v128
          cmake --build --preset swift
      - name: Build Artifact Bundle
        run: |
          cmake --preset swift -D CMAKE_TOOLCHAIN_FILE=cmake/toolchain-wasm32-wasi.cmake \
            -D USEARCH_SWIFT_TRIPLES=wasm32-unknown-wasip1
          cmake --build --preset swift
      - name: Build Library and Tests
        run: swift build --build-tests --swift-sdk "swift-${SWIFT_VERSION}-RELEASE_wasm"
      - name: Test under Wasmtime
        run: ~/.wasmtime/bin/wasmtime run -S inherit-env=y --dir / .build/debug/USearchTestsSwift-test-runner.wasm --testing-library swift-testing

  test_windows_x86:
    name: Test on Windows x86 with Visual Studio 2026
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Pull Git submodules
        run: git submodule update --init --recursive

        # C/C++
      - name: Build C/C++
        run: |
          cmake --preset msvc2026_x64
          cmake --build --preset msvc2026_x64
      - name: Test C and C++
        run: ctest --preset msvc2026_x64

        # Python
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group test .
      - name: Test Python
        run: python -X faulthandler -m pytest -x

        # JavaScript
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: npm install --skip-scripts
      - name: Build JavaScript
        run: npm run build-js
      - name: Test JavaScript
        run: npm test

        # Rust
      - name: Set up Rust
        run: |
          rustup update nightly
          rustup default nightly
      - name: Build Rust
        run: cargo build
      - name: Test Rust
        run: cargo test

        # C#
      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Test .NET
        run: |
          mkdir -p "${{ github.workspace }}\csharp\lib\runtimes\win-x64\native"
          cp "${{ github.workspace }}\build_msvc2026_x64\libusearch_shared.dll" "${{ github.workspace }}\csharp\lib\runtimes\win-x64\native"
          dotnet test -c Debug --logger "console;verbosity=detailed"
        shell: bash
        working-directory: ${{ github.workspace }}/csharp

  test_windows_arm:
    name: Build for Windows Arm64
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Pull Git submodules
        run: git submodule update --init --recursive

      - name: Setup MSVC for ARM64
        uses: microsoft/setup-msbuild@v3

        # C/C++
      - name: Build C/C++ for Arm64
        run: |
          cmake --preset msvc2022_arm64
          cmake --build --preset msvc2022_arm64

      - name: Verify ARM64 build artifacts
        run: |
          if (!(Test-Path "build_msvc2022_arm64\libusearch_shared.dll")) { exit 1 }
          Write-Host "ARM64 DLL built successfully"

  build_docker:
    name: Build Docker
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Pull Git submodules
        run: git submodule update --init --recursive
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false

  build_wheels_linux:
    name: Build Python Wheels for ${{ matrix.os }} cp${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    needs: [test_ubuntu_gcc, test_ubuntu_clang]
    strategy:
      matrix:
        os: [ubuntu-26.04, ubuntu-26.04-arm]
        python-version: ["312", "313", "314", "314t", "315", "315t"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install cibuildwheel
        uses: nick-fields/retry@v4
        with:
          max_attempts: 3
          retry_wait_seconds: 10
          timeout_minutes: 180
          command: python -m pip install cibuildwheel
      - name: Build wheels
        uses: nick-fields/retry@v4
        with:
          max_attempts: 2
          retry_wait_seconds: 30
          timeout_minutes: 180
          command: cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: cp${{ matrix.python-version }}-*
          CIBW_PLATFORM: linux
          CIBW_ARCHS_LINUX: native

  build_wheels_macos:
    name: Build Python Wheels for macOS cp${{ matrix.python-version }}
    runs-on: macos-26
    needs: [test_macos]
    strategy:
      matrix:
        python-version: ["312", "313", "314", "314t", "315", "315t"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install cibuildwheel
        uses: nick-fields/retry@v4
        with:
          max_attempts: 3
          retry_wait_seconds: 10
          timeout_minutes: 180
          command: python -m pip install cibuildwheel
      - name: Build wheels
        uses: nick-fields/retry@v4
        with:
          max_attempts: 2
          retry_wait_seconds: 30
          timeout_minutes: 180
          command: cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: cp${{ matrix.python-version }}-*
          CIBW_PLATFORM: macos

  build_wheels_windows:
    name: Build Python Wheels for Windows cp${{ matrix.python-version }}
    runs-on: windows-2022
    needs: [test_windows_x86]
    strategy:
      matrix:
        python-version: ["312", "313", "314", "314t", "315", "315t"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install cibuildwheel
        uses: nick-fields/retry@v4
        with:
          max_attempts: 3
          retry_wait_seconds: 10
          timeout_minutes: 180
          command: python -m pip install cibuildwheel
      - name: Build wheels
        uses: nick-fields/retry@v4
        with:
          max_attempts: 2
          retry_wait_seconds: 30
          timeout_minutes: 180
          command: cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: cp${{ matrix.python-version }}-*
          CIBW_PLATFORM: windows

  test_ubuntu_cross_compilation:
    name: Cross-Compile Linux for ${{ matrix.arch }}
    runs-on: ubuntu-26.04
    env:
      CC: clang
      CXX: clang++
      AR: llvm-ar
      NM: llvm-nm
      RANLIB: llvm-ranlib

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-linux-gnu
          - arch: arm64
            target: aarch64-linux-gnu

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Pull Git submodules
        run: git submodule update --init --recursive

        # C/C++
        # We need to install the cross-compilation toolchain for ARM64 and ARMHF
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld make crossbuild-essential-arm64 crossbuild-essential-armhf libjemalloc-dev

      - name: Build C/C++
        run: |
          cmake --preset library \
            -D CMAKE_C_COMPILER_TARGET=${{ matrix.target }} \
            -D CMAKE_CXX_COMPILER_TARGET=${{ matrix.target }} \
            -D CMAKE_SYSTEM_NAME=Linux \
            -D CMAKE_SYSTEM_PROCESSOR=${{ matrix.arch }}

          cmake --build --preset library

        # We can't run the produced builds, but we can make sure they exist
      - name: Test artifacts presence
        run: |
          test -e build_library/libusearch_shared.so

  # Each machine profile compiles the shared library for one CPU class and one GPU code, compile only; the Arm ones build
  # natively on Arm runners, where the CUDA image also exists. Clang 22 compiles the host units, as Ubuntu 24.04's GCC
  # predates Olympus, and the family codes like `100f` need CMake 3.31, where Ubuntu 24.04 ships 3.28.
  build_machine_profile:
    name: Compile Machine Profile ${{ matrix.preset }}
    runs-on: ${{ contains(fromJSON('["grace_hopper", "vera_rubin"]'), matrix.preset) && 'ubuntu-24.04-arm' || 'ubuntu-26.04' }}
    timeout-minutes: 90
    container: nvidia/cuda:13.4.3-devel-ubuntu26.04
    strategy:
      fail-fast: false
      matrix:
        preset: [xeon4_hopper, xeon6_blackwell, grace_hopper, vera_rubin]
    steps:
      - name: Install Toolchain
        run: |
          apt-get update && apt-get install -y ninja-build g++ git python3-pip curl gnupg
          pip install --break-system-packages "cmake>=3.31"
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/resolute/ llvm-toolchain-resolute-22 main" \
            > /etc/apt/sources.list.d/llvm.list
          apt-get update && apt-get install -y clang-22 lld-22
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Compile Shared Library
        run: |
          cmake --preset ${{ matrix.preset }} -D CMAKE_C_COMPILER=clang-22 -D CMAKE_CXX_COMPILER=clang++-22 \
            -D CMAKE_CUDA_HOST_COMPILER=clang++-22
          cmake --build --preset ${{ matrix.preset }} --parallel 2

  # Compile-only: one library carries both GPU vendors' kernels and links neither runtime, since each driver opens at
  # first use, so a machine without a GPU still loads it.
  build_cuda_rocm_library:
    name: Compile CUDA and ROCm Library without GPU Runtimes
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    container: rocm/dev-ubuntu-26.04:10.0.0-full
    steps:
      # ROCm 10's Clang is LLVM 23, under which NVCC 13.4's front end rejects libstdc++'s `<atomic>`, so NVCC hosts
      # on Clang 22.
      - name: Install Toolchain
        run: |
          apt-get update && apt-get install -y ninja-build git curl gnupg python3-pip binutils
          pip install --break-system-packages "cmake>=3.31"
          curl -sSLO https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2604/x86_64/cuda-keyring_1.1-1_all.deb
          dpkg -i cuda-keyring_1.1-1_all.deb
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/resolute/ llvm-toolchain-resolute-22 main" \
            > /etc/apt/sources.list.d/llvm.list
          apt-get update && apt-get install -y clang-22 cuda-minimal-build-13-4 cuda-driver-dev-13-4
          echo "/usr/local/cuda-13.4/bin" >> "$GITHUB_PATH"
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Compile Shared Library
        run: |
          cmake --preset linux_cuda_rocm -D CMAKE_CUDA_HOST_COMPILER=clang++-22
          cmake --build --preset linux_cuda_rocm --target usearch_shared --parallel 2
      - name: Check No GPU Runtime Is Linked
        run: |
          readelf -d build_linux_cuda_rocm/libusearch_shared.so
          if readelf -d build_linux_cuda_rocm/libusearch_shared.so | grep -E 'NEEDED.*(libcudart|libcuda\.|libamdhip64)'; then
            echo "libusearch_shared.so links a GPU runtime" && exit 1
          fi

  # One row per checked-in WebAssembly toolchain. A module carries one SIMD tier, width and threads choice, so each
  # row is a whole build; its C test runs under the matrix's Node for Emscripten and under Wasmtime for WASI.
  test_wasm:
    name: Test on WebAssembly ${{ matrix.preset }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { preset: wasm32_emscripten, sdk: emscripten, node: 22 }
          - { preset: wasm64_emscripten, sdk: emscripten, node: 24 }
          - { preset: wasm32_wasi, sdk: wasi }

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Pull Git submodules
        run: git submodule update --init --recursive

      - name: Setup Emscripten
        if: matrix.sdk == 'emscripten'
        uses: mymindstorm/setup-emsdk@v16
        with:
          version: ${{ env.EMSCRIPTEN_VERSION }}
      - name: Setup Node.js
        if: matrix.sdk == 'emscripten'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Setup WASI SDK and Wasmtime
        if: matrix.sdk == 'wasi'
        run: |
          curl -sSL "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_VERSION}/wasi-sdk-${WASI_SDK_VERSION}.0-x86_64-linux.tar.gz" \
            | tar xz -C "$HOME"
          echo "WASI_SDK_PATH=$HOME/wasi-sdk-${WASI_SDK_VERSION}.0-x86_64-linux" >> "$GITHUB_ENV"
          curl https://wasmtime.dev/install.sh -sSf | bash -s -- --version "$WASMTIME_VERSION"
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"

      - name: Build and test C
        run: cmake --workflow --preset ${{ matrix.preset }}

  test_android:
    name: Build for Android ${{ matrix.abi }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - processor: armv7a
            abi: armeabi-v7a
            preset: android_armv7
            target: armv7-linux-androideabi
            arch: arm32
          - processor: aarch64
            abi: arm64-v8a
            preset: android_arm64
            target: aarch64-linux-android
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Pull Git submodules
        run: git submodule update --init --recursive

      - name: Install NDK
        run: |
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;${{ env.ANDROID_NDK_VERSION }}"

      - name: Build C/C++
        run: |
          export ANDROID_NDK_ROOT="${ANDROID_HOME}/ndk/${{ env.ANDROID_NDK_VERSION }}"
          cmake --preset ${{ matrix.preset }} -D ANDROID_PLATFORM=${{ env.ANDROID_SDK_VERSION }}
          cmake --build --preset ${{ matrix.preset }}

        # We can't run the produced builds, but we can make sure they exist
      - name: Test artifacts presence
        run: test -e build_${{ matrix.preset }}/libusearch_shared.so

        # Rust
      - name: Set up Rust
        run: |
          rustup update nightly
          rustup default nightly
          rustup target add ${{ matrix.target }}

      - name: Set up Rust Env
        run: |
          TOOLCHAIN=${ANDROID_HOME}/ndk/${{ env.ANDROID_NDK_VERSION }}/toolchains/llvm/prebuilt/linux-x86_64/bin/
          NDK_CLANG=$(find ${TOOLCHAIN} -name "${{ matrix.processor }}*${{ env.ANDROID_SDK_VERSION }}-clang")
          echo "CC_${{ matrix.target }}=${NDK_CLANG}" >> ${GITHUB_ENV}
          echo "CXX_${{ matrix.target }}=${NDK_CLANG}++" >> ${GITHUB_ENV}
          echo "AR_${{ matrix.target }}=${TOOLCHAIN}/llvm-ar" >> ${GITHUB_ENV}
          echo "CARGO_${{ matrix.target }}=${NDK_CLANG}" >> ${GITHUB_ENV}
          echo "CARGO_${{ matrix.target }}=${TOOLCHAIN}/llvm-ar" >> ${GITHUB_ENV}

      - name: Build Rust
        run: cargo build --target ${{ matrix.target }}

        # Java
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "adopt"

        # We skip native compilation with Gradle and focus just on the Java part,
        # assuming the we won't be able to tun the tests without emulation
      - name: Check Java formatting
        run: gradle spotlessCheck
      - name: Test Java bindings with Android library
        run: |
          mkdir -p build/libs/usearch/shared/
          cp build_${{ matrix.preset }}/libusearch_shared.so build/libs/usearch/shared/
          javac -cp . java/cloud/unum/usearch/*.java
          echo "Java compilation successful with Android NDK library"

      - name: Package Android libraries for release
        run: |
          version=$(cat VERSION)
          zip -r usearch_android_${{ matrix.arch }}_${version}.zip build_${{ matrix.preset }}/libusearch_shared.so c/usearch \
            include/usearch cpp/usearch

      - name: Upload Android libraries
        uses: actions/upload-artifact@v7
        with:
          name: android-${{ matrix.abi }}-libraries
          path: usearch_android_*.zip

  build_docs:
    name: Build Docs
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Pull Git submodules
        run: git submodule update --init --recursive
      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install Doxygen
        run: |
          curl -sSfL https://www.doxygen.nl/files/doxygen-1.18.0.linux.bin.tar.gz | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/doxygen-1.18.0/bin" >> "$GITHUB_PATH"
      - name: Install Sphinx
        run: pip install -r docs/requirements.txt
      - name: Install USearch from the Checkout
        run: pip install .
      - name: Build Docs
        run: cd docs && doxygen conf.dox && sphinx-build -M html . ../build/docs -W
