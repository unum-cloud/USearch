name: Pre-Release

on:
  push:
    branches: ["main-dev"]
  pull_request:
    branches: ["main-dev"]

env:
  GH_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
  PYTHONUTF8: 1
  PYTHONFAULTHANDLER: 1
  PYTHON_VERSION: 3.11
  DOTNET_VERSION: 8.0.x
  NODE_VERSION: 20
  JAVA_VERSION: 25
  GO_VERSION: "^1.22.0"
  ANDROID_NDK_VERSION: 26.3.11579264
  ANDROID_SDK_VERSION: 21
  EMSCRIPTEN_VERSION: 6.0.9
  WASI_SDK_VERSION: "34"
  WASMTIME_VERSION: v48.0.2

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read

jobs:
  versioning:
    name: Update Version
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run TinySemVer
        uses: ashvardanian/tinysemver@v3
        with:
          verbose: "true"
          version-file: "VERSION"
          update-version-in: |
            package.json:"version": "(\d+\.\d+\.\d+)"
            CITATION.cff:^version: (\d+\.\d+\.\d+)
            Cargo.toml:^version = "(\d+\.\d+\.\d+)"
            conanfile.py:version = "(\d+\.\d+\.\d+)"
            java/README.md:usearchVersion = '(\d+\.\d+\.\d+)'
            java/README.md:version: '(\d+\.\d+\.\d+)'
            README.md:version = {(\d+\.\d+\.\d+)}
            csharp/nuget/nuget-package.props:>(\d+\.\d+\.\d+)</Version>
            CMakeLists.txt:VERSION (\d+\.\d+\.\d+)
          update-major-version-in: |
            include/usearch/types.h:^#define USEARCH_VERSION_MAJOR (\d+)
          update-minor-version-in: |
            include/usearch/types.h:^#define USEARCH_VERSION_MINOR (\d+)
          update-patch-version-in: |
            include/usearch/types.h:^#define USEARCH_VERSION_PATCH (\d+)
          dry-run: "true"

  test_ubuntu_gcc:
    name: Ubuntu (GCC 14)
    runs-on: ubuntu-24.04
    env:
      CC: gcc
      CXX: g++

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Pull Git submodules
        run: git submodule update --init --recursive

        # C/C++
      - name: Build C/C++
        run: |
          sudo apt update
          sudo apt install -y cmake build-essential libjemalloc-dev libomp-dev
          cmake -B build_artifacts -D CMAKE_BUILD_TYPE=RelWithDebInfo -D USEARCH_BUILD_TEST_CPP=1 -D USEARCH_BUILD_TEST_C=1 -D USEARCH_BUILD_LIB_C=1 -D USEARCH_USE_JEMALLOC=1
          cmake --build build_artifacts --config RelWithDebInfo
      - name: Test C++
        run: build_artifacts/test_cpp
      - name: Test C
        run: build_artifacts/usearch_test_c

        # Python
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build Python
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-repeat numpy

          python -m pip install .
      - name: Test Python
        run: pytest

        # JavaScript
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: npm install --skip-scripts
      - name: Build JavaScript
        run: npm run build-js
      - name: Test JavaScript
        run: npm test

        # Rust
      - name: Set up Rust
        run: |
          rustup update stable
          rustup default stable
          rustup component add clippy
          rustc -vV
      - name: Lint Rust
        run: cargo clippy --all-targets -- -D warnings
      - name: Build Rust
        run: cargo build
      - name: Test Rust
        run: cargo test

        # Java
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "adopt"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Check Java, Kotlin & Scala formatting
        run: gradle spotlessCheck
      - name: Test Java
        run: gradle clean build
      # The Java surface is what Kotlin and Scala consume, so both compile against it and run here:
      # `@NullMarked` only reaches a Kotlin caller if it survives compilation, and nothing else in
      # the matrix would notice if it stopped.
      - name: Test Java from Kotlin & Scala
        run: gradle kotlinInteropTest scalaInteropTest

        # C#
      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Test .NET
        run: |
          mkdir -p "${{ github.workspace }}/csharp/lib/runtimes/linux-x64/native"
          cp "${{ github.workspace }}/build_artifacts/libusearch_shared.so" "${{ github.workspace }}/csharp/lib/runtimes/linux-x64/native"
          dotnet test -c Debug --logger "console;verbosity=detailed"
        shell: bash
        working-directory: ${{ github.workspace }}/csharp

        # GoLang
        # With `LD_DEBUG=all` we detect the addresses of the libraries that are loaded
      - name: Test GoLang
        run: |
          sudo cp ${{ github.workspace }}/build_artifacts/libusearch_shared.so /usr/lib/libusearch_shared.so
          sudo cp -r ${{ github.workspace }}/include/usearch /usr/include/
          test -z "$(gofmt -l .)"
          go vet ./...
          LD_DEBUG=all go test -race -v ./...
        working-directory: ${{ github.workspace }}/golang/

  verify_models:
    name: Check Promela models
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Pull Git submodules
        run: git submodule update --init --recursive
      - name: Install Spin
        run: |
          sudo apt update
          sudo apt install -y spin
      - name: Check the models
        run: verification/check.sh

  verify_clients:
    name: Check GenMC clients
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Pull Git submodules
        run: git submodule update --init --recursive
      - name: Install Spin, Clang and the GenMC build dependencies
        run: |
          sudo apt update
          sudo apt install -y spin cmake clang-20 llvm-20-dev libffi-dev zlib1g-dev libedit-dev
      - name: Checkout GenMC
        uses: actions/checkout@v7
        with:
          repository: MPI-SWS/genmc
          ref: fe124db203f6d1a626057d72f07e25409075d809
          path: genmc
      - name: Restore the GenMC build
        id: genmc
        uses: actions/cache@v6
        with:
          path: genmc/build
          key: genmc-fe124db-clang-20
      - name: Build GenMC
        if: steps.genmc.outputs.cache-hit != 'true'
        run: |
          cmake -S genmc -B genmc/build -D CMAKE_BUILD_TYPE=Release -D CMAKE_C_COMPILER=clang-20 -D CMAKE_CXX_COMPILER=clang++-20 -D LLVM_DIR=/usr/lib/llvm-20/lib/cmake/llvm
          cmake --build genmc/build --parallel
      - name: Check the models and the clients
        run: verification/check.sh
        env:
          GENMC: ${{ github.workspace }}/genmc/build/bin/genmc
          GENMC_CLANG: clang++-20

  test_ubuntu_clang:
    name: Ubuntu (Clang 20)
    runs-on: ubuntu-24.04
    env:
      CC: clang-20
      CXX: clang++-20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Pull Git submodules
        run: git submodule update --init --recursive

        # C/C++
      - name: Build C/C++
        run: |
          sudo apt update
          sudo apt install -y cmake build-essential libjemalloc-dev clang-20
          cmake -B build_artifacts -D CMAKE_BUILD_TYPE=RelWithDebInfo -D USEARCH_BUILD_TEST_CPP=1 -D USEARCH_BUILD_TEST_C=1 -D USEARCH_BUILD_LIB_C=1 -D USEARCH_USE_JEMALLOC=1
          cmake --build build_artifacts --config RelWithDebInfo
      - name: Test C++
        run: build_artifacts/test_cpp
      - name: Test C
        run: build_artifacts/usearch_test_c

        # JavaScript
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: npm install --skip-scripts
      - name: Build JavaScript
        run: npm run build-js
      - name: Test JavaScript
        run: npm test

        # Python
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build Python
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-repeat numpy

          python -m pip install .
        env:
          CXX: clang++
          CC: clang++ # Override the default compiler
      - name: Test Python
        run: pytest

        # Rust
      - name: Set up Rust
        run: |
          rustup update stable
          rustup default stable
          rustc -vV
      - name: Build Rust
        run: cargo build
      - name: Test Rust
        run: cargo test

        # C#
      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Test .NET
        run: |
          mkdir -p "${{ github.workspace }}/csharp/lib/runtimes/linux-x64/native"
          cp "${{ github.workspace }}/build_artifacts/libusearch_shared.so" "${{ github.workspace }}/csharp/lib/runtimes/linux-x64/native"
          dotnet test -c Debug --logger "console;verbosity=detailed"
        shell: bash
        working-directory: ${{ github.workspace }}/csharp

  test_macos:
    name: macOS
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Pull Git submodules
        run: git submodule update --init --recursive

        # C/C++
      - name: Build C/C++
        run: |
          brew update
          brew reinstall cmake
          cmake -B build_artifacts -D CMAKE_BUILD_TYPE=RelWithDebInfo -D USEARCH_BUILD_TEST_CPP=1 -D USEARCH_BUILD_TEST_C=1 -D USEARCH_BUILD_LIB_C=1
          cmake --build build_artifacts --config RelWithDebInfo
      - name: Test C++
        run: build_artifacts/test_cpp
      - name: Test C
        run: build_artifacts/usearch_test_c

        # JavaScript
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: npm install --skip-scripts
      - name: Build JavaScript
        run: npm run build-js
      - name: Test JavaScript
        run: npm test

        # Python
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build Python
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-repeat numpy
          python -m pip install .
        env:
          CXX: clang++
          CC: clang++ # Override the default compiler
      - name: Test Python
        run: pytest

        # ObjC/Swift
      - name: Build ObjC/Swift
        run: swift build
      - name: Test ObjC/Swift
        run: swift test

        # Rust
      - name: Set up Rust
        run: |
          rustup update stable
          rustup default stable
          rustc -vV
      - name: Build Rust
        run: cargo build
      - name: Test Rust
        run: cargo test

        # C#
      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Test .NET
        run: |
          mkdir -p "${{ github.workspace }}/csharp/lib/runtimes/osx-arm64/native"
          cp "${{ github.workspace }}/build_artifacts/libusearch_shared.dylib" "${{ github.workspace }}/csharp/lib/runtimes/osx-arm64/native"
          dotnet test -c Debug --logger "console;verbosity=minimal" --filter "FullyQualifiedName!=Cloud.Unum.USearch.Tests.UsearchIndexTests.PersistAndRestore"
        shell: bash
        working-directory: ${{ github.workspace }}/csharp

  test_windows_x86:
    name: Windows (X86)
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Pull Git submodules
        run: git submodule update --init --recursive

        # C/C++
      - name: Build C/C++
        run: |
          choco install cmake
          cmake -B build_artifacts -D CMAKE_BUILD_TYPE=RelWithDebInfo -D USEARCH_BUILD_TEST_CPP=1 -D USEARCH_BUILD_TEST_C=1 -D USEARCH_BUILD_LIB_C=1
          cmake --build build_artifacts --config RelWithDebInfo
      - name: Test C++
        run: .\build_artifacts\test_cpp.exe
      - name: Test C
        run: .\build_artifacts\usearch_test_c.exe

        # Python
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build Python
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-repeat numpy
          python -m pip install .
      - name: Test Python
        run: pytest

        # JavaScript
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: npm install --skip-scripts
      - name: Build JavaScript
        run: npm run build-js
      - name: Test JavaScript
        run: npm test

        # Rust
      - name: Set up Rust
        run: |
          rustup update stable
          rustup default stable
          rustc -vV
      - name: Build Rust
        run: cargo build
      - name: Test Rust
        run: cargo test

        # C#
      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Test .NET
        run: |
          mkdir -p "${{ github.workspace }}\csharp\lib\runtimes\win-x64\native"
          cp "${{ github.workspace }}\build_artifacts\libusearch_shared.dll" "${{ github.workspace }}\csharp\lib\runtimes\win-x64\native"
          dotnet test -c Debug --logger "console;verbosity=detailed"
        shell: bash
        working-directory: ${{ github.workspace }}/csharp

  test_windows_arm:
    name: Windows (ARM)
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Pull Git submodules
        run: git submodule update --init --recursive

      - name: Setup MSVC for ARM64
        uses: microsoft/setup-msbuild@v3

        # C/C++
      - name: Build C/C++ (ARM64)
        run: |
          choco install cmake
          cmake -G "Visual Studio 17 2022" -A ARM64 -B build_artifacts -D CMAKE_BUILD_TYPE=RelWithDebInfo -D USEARCH_BUILD_LIB_C=1 -D USEARCH_BUILD_TEST_CPP=0 -D USEARCH_BUILD_TEST_C=0
          cmake --build build_artifacts --config RelWithDebInfo

      - name: Verify ARM64 build artifacts
        run: |
          if (!(Test-Path "build_artifacts\libusearch_shared.dll")) { exit 1 }
          Write-Host "ARM64 DLL built successfully"

  build_docker:
    name: Build Docker
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Pull Git submodules
        run: git submodule update --init --recursive
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false

  build_wheels_linux:
    name: Build Python Wheels (Linux)
    runs-on: ubuntu-24.04
    needs: [test_ubuntu_gcc, test_ubuntu_clang]
    strategy:
      matrix:
        python-version: ["310", "311", "312", "313", "313t", "314", "314t"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4
      - name: Install cibuildwheel
        uses: nick-fields/retry@v4
        with:
          max_attempts: 3
          retry_wait_seconds: 10
          timeout_minutes: 180
          command: python -m pip install cibuildwheel
      - name: Build wheels
        uses: nick-fields/retry@v4
        with:
          max_attempts: 2
          retry_wait_seconds: 30
          timeout_minutes: 180
          command: cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: cp${{ matrix.python-version }}-*
          CIBW_ENABLE: cpython-freethreading
          CIBW_PLATFORM: linux

  build_wheels_macos:
    name: Build Python Wheels (macOS)
    runs-on: macos-14
    needs: [test_macos]
    strategy:
      matrix:
        python-version: ["310", "311", "312", "313", "313t", "314", "314t"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install cibuildwheel
        uses: nick-fields/retry@v4
        with:
          max_attempts: 3
          retry_wait_seconds: 10
          timeout_minutes: 180
          command: python -m pip install cibuildwheel
      - name: Build wheels
        uses: nick-fields/retry@v4
        with:
          max_attempts: 2
          retry_wait_seconds: 30
          timeout_minutes: 180
          command: cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: cp${{ matrix.python-version }}-*
          CIBW_ENABLE: cpython-freethreading
          CIBW_PLATFORM: macos

  build_wheels_windows:
    name: Build Python Wheels (Windows)
    runs-on: windows-2022
    needs: [test_windows_x86]
    strategy:
      matrix:
        python-version: ["310", "311", "312", "313", "313t", "314", "314t"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install cibuildwheel
        uses: nick-fields/retry@v4
        with:
          max_attempts: 3
          retry_wait_seconds: 10
          timeout_minutes: 180
          command: python -m pip install cibuildwheel
      - name: Build wheels
        uses: nick-fields/retry@v4
        with:
          max_attempts: 2
          retry_wait_seconds: 30
          timeout_minutes: 180
          command: cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: cp${{ matrix.python-version }}-*
          CIBW_ENABLE: cpython-freethreading
          CIBW_PLATFORM: windows

  test_ubuntu_cross_compilation:
    name: Cross-Compile Linux
    runs-on: ubuntu-24.04
    env:
      CC: clang
      CXX: clang++
      AR: llvm-ar
      NM: llvm-nm
      RANLIB: llvm-ranlib

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-linux-gnu
          - arch: arm64
            target: aarch64-linux-gnu

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Pull Git submodules
        run: git submodule update --init --recursive

        # C/C++
        # We need to install the cross-compilation toolchain for ARM64 and ARMHF
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld make crossbuild-essential-arm64 crossbuild-essential-armhf libjemalloc-dev

      - name: Build C/C++
        run: |
          cmake -B build_artifacts \
            -D CMAKE_BUILD_TYPE=RelWithDebInfo \
            -D CMAKE_EXPORT_COMPILE_COMMANDS=1 \
            -D CMAKE_C_COMPILER_TARGET=${{ matrix.target }} \
            -D CMAKE_CXX_COMPILER_TARGET=${{ matrix.target }} \
            -D CMAKE_SYSTEM_NAME=Linux \
            -D CMAKE_SYSTEM_PROCESSOR=${{ matrix.arch }} \
            -D USEARCH_BUILD_LIB_C=1 \
            -D USEARCH_BUILD_TEST_CPP=0 \
            -D USEARCH_BUILD_BENCH_CPP=0

          cmake --build build_artifacts --config RelWithDebInfo

        # We can't run the produced builds, but we can make sure they exist
      - name: Test artifacts presence
        run: |
          test -e build_artifacts/libusearch_shared.so

  # One row per checked-in WebAssembly toolchain. A module carries one SIMD tier, width and threads choice, so each
  # row is a whole build; its C test runs under the matrix's Node for Emscripten and under Wasmtime for WASI.
  test_wasm:
    name: WebAssembly (${{ matrix.toolchain }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { toolchain: wasm32-emscripten, sdk: emscripten, wrapper: emcmake, node: 22 }
          - { toolchain: wasm64-emscripten, sdk: emscripten, wrapper: emcmake, node: 24 }
          - { toolchain: wasm32-wasi, sdk: wasi, wrapper: "" }

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Pull Git submodules
        run: git submodule update --init --recursive

      - name: Setup Emscripten
        if: matrix.sdk == 'emscripten'
        uses: mymindstorm/setup-emsdk@v16
        with:
          version: ${{ env.EMSCRIPTEN_VERSION }}
      - name: Setup Node.js
        if: matrix.sdk == 'emscripten'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Setup WASI SDK and Wasmtime
        if: matrix.sdk == 'wasi'
        run: |
          curl -sSL "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_VERSION}/wasi-sdk-${WASI_SDK_VERSION}.0-x86_64-linux.tar.gz" \
            | tar xz -C "$HOME"
          echo "WASI_SDK_PATH=$HOME/wasi-sdk-${WASI_SDK_VERSION}.0-x86_64-linux" >> "$GITHUB_ENV"
          curl https://wasmtime.dev/install.sh -sSf | bash -s -- --version "$WASMTIME_VERSION"
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"

      - name: Build and test C
        run: |
          if [ "${{ matrix.sdk }}" = emscripten ]; then emulator="-DCMAKE_CROSSCOMPILING_EMULATOR=$(command -v node)"; fi
          ${{ matrix.wrapper }} cmake -B build_wasm \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain-${{ matrix.toolchain }}.cmake ${emulator:-} \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSEARCH_BUILD_LIB_C=1 \
            -DUSEARCH_BUILD_TEST_C=1 \
            -DUSEARCH_BUILD_TEST_CPP=0 \
            -DUSEARCH_BUILD_BENCH_CPP=0
          cmake --build build_wasm --config Release --target usearch_static usearch_test_c
          ctest --test-dir build_wasm -C Release -R '^usearch_test_c$' --output-on-failure

  test_android:
    name: Android
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - processor: armv7a
            abi: armeabi-v7a
            target: armv7-linux-androideabi
            arch: arm32
          - processor: aarch64
            abi: arm64-v8a
            target: aarch64-linux-android
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Pull Git submodules
        run: git submodule update --init --recursive

      - name: Install NDK
        run: |
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;${{ env.ANDROID_NDK_VERSION }}"

      - name: Build C/C++
        run: |
          cmake -B build_artifacts \
            -D CMAKE_BUILD_TYPE=RelWithDebInfo \
            -D CMAKE_EXPORT_COMPILE_COMMANDS=1 \
            -D CMAKE_TOOLCHAIN_FILE=${ANDROID_HOME}/ndk/${{ env.ANDROID_NDK_VERSION }}/build/cmake/android.toolchain.cmake \
            -D CMAKE_ANDROID_STL_TYPE=c++_static \
            -D ANDROID_PLATFORM=${{ env.ANDROID_SDK_VERSION }} \
            -D ANDROID_ABI=${{ matrix.abi }} \
            -D USEARCH_BUILD_LIB_C=1 \
            -D USEARCH_BUILD_TEST_CPP=0 \
            -D USEARCH_BUILD_BENCH_CPP=0

          cmake --build build_artifacts --config RelWithDebInfo

        # We can't run the produced builds, but we can make sure they exist
      - name: Test artifacts presence
        run: test -e build_artifacts/libusearch_shared.so

        # Rust
      - name: Set up Rust
        run: |
          rustup update stable
          rustup default stable
          rustup target add ${{ matrix.target }}
          rustc -vV

      - name: Set up Rust Env
        run: |
          TOOLCHAIN=${ANDROID_HOME}/ndk/${{ env.ANDROID_NDK_VERSION }}/toolchains/llvm/prebuilt/linux-x86_64/bin/
          NDK_CLANG=$(find ${TOOLCHAIN} -name "${{ matrix.processor }}*${{ env.ANDROID_SDK_VERSION }}-clang")
          echo "CC_${{ matrix.target }}=${NDK_CLANG}" >> ${GITHUB_ENV}
          echo "CXX_${{ matrix.target }}=${NDK_CLANG}++" >> ${GITHUB_ENV}
          echo "AR_${{ matrix.target }}=${TOOLCHAIN}/llvm-ar" >> ${GITHUB_ENV}
          echo "CARGO_${{ matrix.target }}=${NDK_CLANG}" >> ${GITHUB_ENV}
          echo "CARGO_${{ matrix.target }}=${TOOLCHAIN}/llvm-ar" >> ${GITHUB_ENV}

      - name: Build Rust
        run: cargo build --target ${{ matrix.target }}

        # Java
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "adopt"

        # We skip native compilation with Gradle and focus just on the Java part,
        # assuming the we won't be able to tun the tests without emulation
      - name: Check Java formatting
        run: gradle spotlessCheck
      - name: Test Java bindings with Android library
        run: |
          mkdir -p build/libs/usearch/shared/
          cp build_artifacts/libusearch_shared.so build/libs/usearch/shared/
          javac -cp . java/cloud/unum/usearch/*.java
          echo "Java compilation successful with Android NDK library"

      - name: Package Android libraries for release
        run: |
          version=$(cat VERSION)
          zip -r usearch_android_${{ matrix.arch }}_${version}.zip build_artifacts/libusearch_shared.so include/usearch

      - name: Upload Android libraries
        uses: actions/upload-artifact@v7
        with:
          name: android-${{ matrix.abi }}-libraries
          path: usearch_android_*.zip
