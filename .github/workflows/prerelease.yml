name: Pre-Release

on:
  push:
    branches: ["main-dev"]
  pull_request:
    branches: ["main-dev"]

env:
  GH_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
  PYTHONUTF8: 1
  PYTHONFAULTHANDLER: 1
  PYTHON_VERSION: 3.12
  DOTNET_VERSION: 10.0.x
  NODE_VERSION: 22
  JAVA_VERSION: 25
  GO_VERSION: "^1.22.0"
  ANDROID_NDK_VERSION: 26.3.11579264
  ANDROID_SDK_VERSION: 21
  EMSCRIPTEN_VERSION: 6.0.9
  WASI_SDK_VERSION: "34"
  WASMTIME_VERSION: v48.0.2

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read

jobs:
  versioning:
    name: Update Version
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run TinySemVer
        uses: ashvardanian/tinysemver@v3
        with:
          verbose: "true"
          version-file: "VERSION"
          update-version-in: |
            package.json:"version": "(\d+\.\d+\.\d+)"
            CITATION.cff:^version: (\d+\.\d+\.\d+)
            Cargo.toml:^version = "(\d+\.\d+\.\d+)"
            conanfile.py:version = "(\d+\.\d+\.\d+)"
            java/README.md:usearchVersion = '(\d+\.\d+\.\d+)'
            java/README.md:version: '(\d+\.\d+\.\d+)'
            README.md:version = {(\d+\.\d+\.\d+)}
            csharp/nuget/nuget-package.props:>(\d+\.\d+\.\d+)</Version>
            CMakeLists.txt:VERSION (\d+\.\d+\.\d+)
          update-major-version-in: |
            c/usearch/types.h:^#define USEARCH_VERSION_MAJOR (\d+)
          update-minor-version-in: |
            c/usearch/types.h:^#define USEARCH_VERSION_MINOR (\d+)
          update-patch-version-in: |
            c/usearch/types.h:^#define USEARCH_VERSION_PATCH (\d+)
          dry-run: "true"

  test_ubuntu_gcc:
    name: Test on Ubuntu with GCC 14
    runs-on: ubuntu-26.04
    env:
      CC: gcc-14
      CXX: g++-14

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Pull Git submodules
        run: git submodule update --init --recursive

        # C/C++
      - name: Build C/C++
        run: |
          sudo apt update
          sudo apt install -y build-essential g++-14 lld libjemalloc-dev libomp-dev
          cmake --preset host_relwithdebinfo -D CMAKE_C_COMPILER=gcc-14 -D CMAKE_CXX_COMPILER=g++-14 -D USEARCH_BUILD_LIB_C=1 -D USEARCH_USE_JEMALLOC=1
          cmake --build --preset host_relwithdebinfo
      - name: Test C and C++
        run: ctest --preset host_relwithdebinfo

        # Python
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group test .
      - name: Test Python
        run: python -X faulthandler -m pytest -x

        # JavaScript
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: npm install --skip-scripts
      - name: Build JavaScript
        run: npm run build-js
      - name: Test JavaScript
        run: npm test

        # Rust
      - name: Set up Rust
        run: |
          rustup update nightly
          rustup default nightly
          rustup component add clippy
          rustc -vV
      - name: Lint Rust
        run: cargo clippy --all-targets -- -D warnings
      - name: Build Rust
        run: cargo build
      - name: Test Rust
        run: cargo test

        # Java
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "adopt"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Check Java, Kotlin & Scala formatting
        run: gradle spotlessCheck
      - name: Test Java
        run: gradle clean build
      # The Java surface is what Kotlin and Scala consume, so both compile against it and run here:
      # `@NullMarked` only reaches a Kotlin caller if it survives compilation, and nothing else in
      # the matrix would notice if it stopped.
      - name: Test Java from Kotlin & Scala
        run: gradle kotlinInteropTest scalaInteropTest

        # C#
      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Test .NET
        run: |
          mkdir -p "${{ github.workspace }}/csharp/lib/runtimes/linux-x64/native"
          cp "${{ github.workspace }}/build_host_relwithdebinfo/libusearch_shared.so" "${{ github.workspace }}/csharp/lib/runtimes/linux-x64/native"
          dotnet test -c Debug --logger "console;verbosity=detailed"
        shell: bash
        working-directory: ${{ github.workspace }}/csharp

        # GoLang
        # With `LD_DEBUG=all` we detect the addresses of the libraries that are loaded
      - name: Test GoLang
        run: |
          sudo cp ${{ github.workspace }}/build_host_relwithdebinfo/libusearch_shared.so /usr/lib/libusearch_shared.so
          for root in c include cpp; do sudo cp -r ${{ github.workspace }}/$root/usearch /usr/include/; done
          test -z "$(gofmt -l .)"
          go vet ./...
          LD_DEBUG=all go test -race -v ./...
        working-directory: ${{ github.workspace }}/golang/

  test_ubuntu_debug:
    name: Test Debug build on Ubuntu
    runs-on: ubuntu-26.04
    env:
      CC: gcc
      CXX: g++

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Pull Git submodules
        run: git submodule update --init --recursive
      - name: Build C/C++ with asserts
        run: |
          sudo apt update
          sudo apt install -y build-essential lld libjemalloc-dev libomp-dev
          cmake --preset host_debug -D CMAKE_C_COMPILER=gcc -D CMAKE_CXX_COMPILER=g++
          cmake --build --preset host_debug
      - name: Test C/C++
        run: ctest --preset host_debug

  verify_clients:
    name: Check Promela models and GenMC clients
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Pull Git submodules
        run: git submodule update --init --recursive
      - name: Install Spin, Clang and the GenMC build dependencies
        run: |
          sudo apt update
          sudo apt install -y spin cmake clang-20 llvm-20-dev libffi-dev zlib1g-dev libedit-dev
      - name: Checkout GenMC
        uses: actions/checkout@v7
        with:
          repository: MPI-SWS/genmc
          ref: 9f6c4c0772d0c42b325681581acc6a0f3eb9b5f7
          path: genmc
      - name: Restore the GenMC build
        id: genmc
        uses: actions/cache@v6
        with:
          path: genmc/build
          key: genmc-9f6c4c0-clang-20
      - name: Build GenMC
        if: steps.genmc.outputs.cache-hit != 'true'
        run: |
          cmake -S genmc -B genmc/build -D CMAKE_BUILD_TYPE=Release -D CMAKE_C_COMPILER=clang-20 -D CMAKE_CXX_COMPILER=clang++-20 -D LLVM_DIR=/usr/lib/llvm-20/lib/cmake/llvm
          cmake --build genmc/build --parallel
      - name: Check the models and the clients
        run: verification/check.sh
        env:
          GENMC: ${{ github.workspace }}/genmc/build/bin/genmc
          GENMC_CLANG: clang++-20
          CPLUS_INCLUDE_PATH: ${{ github.workspace }}/forkunion/include

  test_ubuntu_clang:
    name: Test on Ubuntu with Clang 20
    runs-on: ubuntu-26.04
    env:
      CC: clang-20
      CXX: clang++-20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Pull Git submodules
        run: git submodule update --init --recursive

        # C/C++
      - name: Build C/C++
        run: |
          sudo apt update
          sudo apt install -y build-essential clang-20 lld libjemalloc-dev
          cmake --preset host_relwithdebinfo -D CMAKE_C_COMPILER=clang-20 -D CMAKE_CXX_COMPILER=clang++-20 -D USEARCH_BUILD_LIB_C=1 -D USEARCH_USE_JEMALLOC=1
          cmake --build --preset host_relwithdebinfo
      - name: Test C and C++
        run: ctest --preset host_relwithdebinfo

        # JavaScript
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: npm install --skip-scripts
      - name: Build JavaScript
        run: npm run build-js
      - name: Test JavaScript
        run: npm test

        # Python
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group test .
        env:
          CXX: clang++
          CC: clang++ # Override the default compiler
      - name: Test Python
        run: python -X faulthandler -m pytest -x

        # Rust
      - name: Set up Rust
        run: |
          rustup update nightly
          rustup default nightly
          rustc -vV
      - name: Build Rust
        run: cargo build
      - name: Test Rust
        run: cargo test

        # C#
      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Test .NET
        run: |
          mkdir -p "${{ github.workspace }}/csharp/lib/runtimes/linux-x64/native"
          cp "${{ github.workspace }}/build_host_relwithdebinfo/libusearch_shared.so" "${{ github.workspace }}/csharp/lib/runtimes/linux-x64/native"
          dotnet test -c Debug --logger "console;verbosity=detailed"
        shell: bash
        working-directory: ${{ github.workspace }}/csharp

  test_macos:
    name: macOS
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Pull Git submodules
        run: git submodule update --init --recursive

        # C/C++
      - name: Build C/C++
        run: |
          brew update
          brew reinstall cmake
          # Apple's linker is fast already; the preset's `lld` stands in for GNU `ld` on Linux
          cmake --preset host_relwithdebinfo -D USEARCH_BUILD_LIB_C=1 -D CMAKE_EXE_LINKER_FLAGS= -D CMAKE_SHARED_LINKER_FLAGS=
          cmake --build --preset host_relwithdebinfo
      - name: Test C and C++
        run: ctest --preset host_relwithdebinfo

        # JavaScript
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: npm install --skip-scripts
      - name: Build JavaScript
        run: npm run build-js
      - name: Test JavaScript
        run: npm test

        # Python
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group test .
        env:
          CXX: clang++
          CC: clang++ # Override the default compiler
      - name: Test Python
        run: python -X faulthandler -m pytest -x

        # Rust
      - name: Set up Rust
        run: |
          rustup update nightly
          rustup default nightly
          rustc -vV
      - name: Build Rust
        run: cargo build
      - name: Test Rust
        run: cargo test

        # C#
      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Test .NET
        run: |
          mkdir -p "${{ github.workspace }}/csharp/lib/runtimes/osx-arm64/native"
          cp "${{ github.workspace }}/build_host_relwithdebinfo/libusearch_shared.dylib" "${{ github.workspace }}/csharp/lib/runtimes/osx-arm64/native"
          dotnet test -c Debug --logger "console;verbosity=minimal" --filter "FullyQualifiedName!=Cloud.Unum.USearch.Tests.UsearchIndexTests.PersistAndRestore"
        shell: bash
        working-directory: ${{ github.workspace }}/csharp

  test_swift_macos:
    name: Swift on macOS
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Pull Git submodules
        run: git submodule update --init --recursive
      - name: Build C Library
        run: |
          cmake --preset host_library
          cmake --build --preset host_library --target usearch_static
      - name: Test Swift
        run: swift test -Xlinker -L${{ github.workspace }}/build_host_library

  test_windows_x86:
    name: Test on Windows x86
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Pull Git submodules
        run: git submodule update --init --recursive

        # C/C++
      - name: Build C/C++
        run: |
          choco install cmake
          cmake --preset windows_x64_release
          cmake --build --preset windows_x64_release
      - name: Test C and C++
        run: ctest --preset windows_x64_release

        # Python
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group test .
      - name: Test Python
        run: python -X faulthandler -m pytest -x

        # JavaScript
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: npm install --skip-scripts
      - name: Build JavaScript
        run: npm run build-js
      - name: Test JavaScript
        run: npm test

        # Rust
      - name: Set up Rust
        run: |
          rustup update nightly
          rustup default nightly
          rustc -vV
      - name: Build Rust
        run: cargo build
      - name: Test Rust
        run: cargo test

        # C#
      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Test .NET
        run: |
          mkdir -p "${{ github.workspace }}\csharp\lib\runtimes\win-x64\native"
          cp "${{ github.workspace }}\build_windows_x64_release\libusearch_shared.dll" "${{ github.workspace }}\csharp\lib\runtimes\win-x64\native"
          dotnet test -c Debug --logger "console;verbosity=detailed"
        shell: bash
        working-directory: ${{ github.workspace }}/csharp

  test_windows_arm:
    name: Build for Windows Arm64
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Pull Git submodules
        run: git submodule update --init --recursive

      - name: Setup MSVC for ARM64
        uses: microsoft/setup-msbuild@v3

        # C/C++
      - name: Build C/C++ for Arm64
        run: |
          choco install cmake
          cmake --preset windows_arm64_library
          cmake --build --preset windows_arm64_library

      - name: Verify ARM64 build artifacts
        run: |
          if (!(Test-Path "build_windows_arm64_library\libusearch_shared.dll")) { exit 1 }
          Write-Host "ARM64 DLL built successfully"

  build_docker:
    name: Build Docker
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Pull Git submodules
        run: git submodule update --init --recursive
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false

  build_wheels_linux:
    name: Build Python Wheels for Linux cp${{ matrix.python-version }}
    runs-on: ubuntu-26.04
    needs: [test_ubuntu_gcc, test_ubuntu_clang]
    strategy:
      matrix:
        python-version: ["312", "313", "313t", "314", "314t"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4
      - name: Install cibuildwheel
        uses: nick-fields/retry@v4
        with:
          max_attempts: 3
          retry_wait_seconds: 10
          timeout_minutes: 180
          command: python -m pip install cibuildwheel
      - name: Build wheels
        uses: nick-fields/retry@v4
        with:
          max_attempts: 2
          retry_wait_seconds: 30
          timeout_minutes: 180
          command: cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: cp${{ matrix.python-version }}-*
          CIBW_ENABLE: cpython-freethreading
          CIBW_PLATFORM: linux

  build_wheels_macos:
    name: Build Python Wheels for macOS cp${{ matrix.python-version }}
    runs-on: macos-14
    needs: [test_macos]
    strategy:
      matrix:
        python-version: ["312", "313", "313t", "314", "314t"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install cibuildwheel
        uses: nick-fields/retry@v4
        with:
          max_attempts: 3
          retry_wait_seconds: 10
          timeout_minutes: 180
          command: python -m pip install cibuildwheel
      - name: Build wheels
        uses: nick-fields/retry@v4
        with:
          max_attempts: 2
          retry_wait_seconds: 30
          timeout_minutes: 180
          command: cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: cp${{ matrix.python-version }}-*
          CIBW_ENABLE: cpython-freethreading
          CIBW_PLATFORM: macos

  build_wheels_windows:
    name: Build Python Wheels for Windows cp${{ matrix.python-version }}
    runs-on: windows-2022
    needs: [test_windows_x86]
    strategy:
      matrix:
        python-version: ["312", "313", "313t", "314", "314t"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install cibuildwheel
        uses: nick-fields/retry@v4
        with:
          max_attempts: 3
          retry_wait_seconds: 10
          timeout_minutes: 180
          command: python -m pip install cibuildwheel
      - name: Build wheels
        uses: nick-fields/retry@v4
        with:
          max_attempts: 2
          retry_wait_seconds: 30
          timeout_minutes: 180
          command: cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: cp${{ matrix.python-version }}-*
          CIBW_ENABLE: cpython-freethreading
          CIBW_PLATFORM: windows

  test_ubuntu_cross_compilation:
    name: Cross-Compile Linux for ${{ matrix.arch }}
    runs-on: ubuntu-26.04
    env:
      CC: clang
      CXX: clang++
      AR: llvm-ar
      NM: llvm-nm
      RANLIB: llvm-ranlib

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-linux-gnu
          - arch: arm64
            target: aarch64-linux-gnu

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Pull Git submodules
        run: git submodule update --init --recursive

        # C/C++
        # We need to install the cross-compilation toolchain for ARM64 and ARMHF
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld make crossbuild-essential-arm64 crossbuild-essential-armhf libjemalloc-dev

      - name: Build C/C++
        run: |
          cmake --preset host_library \
            -D CMAKE_C_COMPILER_TARGET=${{ matrix.target }} \
            -D CMAKE_CXX_COMPILER_TARGET=${{ matrix.target }} \
            -D CMAKE_SYSTEM_NAME=Linux \
            -D CMAKE_SYSTEM_PROCESSOR=${{ matrix.arch }}

          cmake --build --preset host_library

        # We can't run the produced builds, but we can make sure they exist
      - name: Test artifacts presence
        run: |
          test -e build_host_library/libusearch_shared.so

  # One row per checked-in WebAssembly toolchain. A module carries one SIMD tier, width and threads choice, so each
  # row is a whole build; its C test runs under the matrix's Node for Emscripten and under Wasmtime for WASI.
  test_wasm:
    name: Test on WebAssembly ${{ matrix.preset }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { preset: wasm32_emscripten_release, sdk: emscripten, node: 22 }
          - { preset: wasm64_emscripten_release, sdk: emscripten, node: 24 }
          - { preset: wasm32_wasi_release, sdk: wasi }

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Pull Git submodules
        run: git submodule update --init --recursive

      - name: Setup Emscripten
        if: matrix.sdk == 'emscripten'
        uses: mymindstorm/setup-emsdk@v16
        with:
          version: ${{ env.EMSCRIPTEN_VERSION }}
      - name: Setup Node.js
        if: matrix.sdk == 'emscripten'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Setup WASI SDK and Wasmtime
        if: matrix.sdk == 'wasi'
        run: |
          curl -sSL "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_VERSION}/wasi-sdk-${WASI_SDK_VERSION}.0-x86_64-linux.tar.gz" \
            | tar xz -C "$HOME"
          echo "WASI_SDK_PATH=$HOME/wasi-sdk-${WASI_SDK_VERSION}.0-x86_64-linux" >> "$GITHUB_ENV"
          curl https://wasmtime.dev/install.sh -sSf | bash -s -- --version "$WASMTIME_VERSION"
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"

      - name: Build and test C
        run: cmake --workflow --preset ${{ matrix.preset }}

  test_android:
    name: Build for Android ${{ matrix.abi }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - processor: armv7a
            abi: armeabi-v7a
            preset: android_armv7_library
            target: armv7-linux-androideabi
            arch: arm32
          - processor: aarch64
            abi: arm64-v8a
            preset: android_arm64_library
            target: aarch64-linux-android
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Pull Git submodules
        run: git submodule update --init --recursive

      - name: Install NDK
        run: |
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;${{ env.ANDROID_NDK_VERSION }}"

      - name: Build C/C++
        run: |
          export ANDROID_NDK_ROOT="${ANDROID_HOME}/ndk/${{ env.ANDROID_NDK_VERSION }}"
          cmake --preset ${{ matrix.preset }} -D ANDROID_PLATFORM=${{ env.ANDROID_SDK_VERSION }}
          cmake --build --preset ${{ matrix.preset }}

        # We can't run the produced builds, but we can make sure they exist
      - name: Test artifacts presence
        run: test -e build_${{ matrix.preset }}/libusearch_shared.so

        # Rust
      - name: Set up Rust
        run: |
          rustup update nightly
          rustup default nightly
          rustup target add ${{ matrix.target }}
          rustc -vV

      - name: Set up Rust Env
        run: |
          TOOLCHAIN=${ANDROID_HOME}/ndk/${{ env.ANDROID_NDK_VERSION }}/toolchains/llvm/prebuilt/linux-x86_64/bin/
          NDK_CLANG=$(find ${TOOLCHAIN} -name "${{ matrix.processor }}*${{ env.ANDROID_SDK_VERSION }}-clang")
          echo "CC_${{ matrix.target }}=${NDK_CLANG}" >> ${GITHUB_ENV}
          echo "CXX_${{ matrix.target }}=${NDK_CLANG}++" >> ${GITHUB_ENV}
          echo "AR_${{ matrix.target }}=${TOOLCHAIN}/llvm-ar" >> ${GITHUB_ENV}
          echo "CARGO_${{ matrix.target }}=${NDK_CLANG}" >> ${GITHUB_ENV}
          echo "CARGO_${{ matrix.target }}=${TOOLCHAIN}/llvm-ar" >> ${GITHUB_ENV}

      - name: Build Rust
        run: cargo build --target ${{ matrix.target }}

        # Java
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "adopt"

        # We skip native compilation with Gradle and focus just on the Java part,
        # assuming the we won't be able to tun the tests without emulation
      - name: Check Java formatting
        run: gradle spotlessCheck
      - name: Test Java bindings with Android library
        run: |
          mkdir -p build/libs/usearch/shared/
          cp build_${{ matrix.preset }}/libusearch_shared.so build/libs/usearch/shared/
          javac -cp . java/cloud/unum/usearch/*.java
          echo "Java compilation successful with Android NDK library"

      - name: Package Android libraries for release
        run: |
          version=$(cat VERSION)
          zip -r usearch_android_${{ matrix.arch }}_${version}.zip build_${{ matrix.preset }}/libusearch_shared.so c/usearch \
            include/usearch cpp/usearch

      - name: Upload Android libraries
        uses: actions/upload-artifact@v7
        with:
          name: android-${{ matrix.abi }}-libraries
          path: usearch_android_*.zip
