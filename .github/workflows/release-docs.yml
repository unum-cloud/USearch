name: Release Docs

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  hooks:
    name: Check Release Commit
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Check the Release Commit
        run: .github/scripts/check-release.sh "$GITHUB_REF_NAME"

  build_docs:
    name: Build Docs
    needs: hooks
    uses: ./.github/workflows/test-docs.yml

  attach_docs:
    name: Attach Docs to the Release
    needs: build_docs
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download Docs
        uses: actions/download-artifact@v8
        with:
          name: docs
      - name: Upload to the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ github.event.release.tag_name }} usearch_docs_*.tar.gz --clobber --repo ${{ github.repository }}
