name: Test C#

on:
  workflow_call:

permissions:
  contents: read

env:
  DOTNET_VERSION: 10.0.x

jobs:
  test_csharp_ubuntu_gcc:
    name: Test C# on Ubuntu with GCC 14
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      CC: gcc-14
      CXX: g++-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Pull Git Submodules
        run: git submodule update --init --recursive
      - name: Install Toolchain
        run: |
          sudo apt update
          sudo apt install -y build-essential g++-14 lld libjemalloc-dev libomp-dev
      - name: Build the Shared C Library
        run: |
          cmake --preset relwithdebinfo -D CMAKE_C_COMPILER=gcc-14 -D CMAKE_CXX_COMPILER=g++-14 -D USEARCH_BUILD_SHARED=1 -D USEARCH_WITH_JEMALLOC=1
          cmake --build --preset relwithdebinfo --target usearch_shared
      - name: Set Up .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Test .NET
        run: |
          mkdir -p "${{ github.workspace }}/csharp/lib/runtimes/linux-x64/native"
          cp "${{ github.workspace }}/build_relwithdebinfo/libusearch_shared.so" "${{ github.workspace }}/csharp/lib/runtimes/linux-x64/native"
          dotnet test -c Debug --logger "console;verbosity=detailed"
        shell: bash
        working-directory: ${{ github.workspace }}/csharp

  test_csharp_ubuntu_clang:
    name: Test C# on Ubuntu with Clang 20
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      CC: clang-20
      CXX: clang++-20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Pull Git Submodules
        run: git submodule update --init --recursive
      - name: Install Toolchain
        run: |
          sudo apt update
          sudo apt install -y build-essential clang-20 lld libjemalloc-dev
      - name: Build the Shared C Library
        run: |
          cmake --preset relwithdebinfo -D CMAKE_C_COMPILER=clang-20 -D CMAKE_CXX_COMPILER=clang++-20 -D USEARCH_BUILD_SHARED=1 -D USEARCH_WITH_JEMALLOC=1
          cmake --build --preset relwithdebinfo --target usearch_shared
      - name: Set Up .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Test .NET
        run: |
          mkdir -p "${{ github.workspace }}/csharp/lib/runtimes/linux-x64/native"
          cp "${{ github.workspace }}/build_relwithdebinfo/libusearch_shared.so" "${{ github.workspace }}/csharp/lib/runtimes/linux-x64/native"
          dotnet test -c Debug --logger "console;verbosity=detailed"
        shell: bash
        working-directory: ${{ github.workspace }}/csharp

  test_csharp_macos:
    name: Test C# on macOS
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Pull Git Submodules
        run: git submodule update --init --recursive
      - name: Build the Shared C Library
        run: |
          # Apple's linker is fast already; the preset's `lld` stands in for GNU `ld` on Linux
          cmake --preset relwithdebinfo -D USEARCH_BUILD_SHARED=1 -D CMAKE_EXE_LINKER_FLAGS= -D CMAKE_SHARED_LINKER_FLAGS=
          cmake --build --preset relwithdebinfo --target usearch_shared
      - name: Set Up .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Test .NET
        run: |
          mkdir -p "${{ github.workspace }}/csharp/lib/runtimes/osx-arm64/native"
          cp "${{ github.workspace }}/build_relwithdebinfo/libusearch_shared.dylib" "${{ github.workspace }}/csharp/lib/runtimes/osx-arm64/native"
          dotnet test -c Debug --logger "console;verbosity=minimal" --filter "FullyQualifiedName!=Cloud.Unum.USearch.Tests.UsearchIndexTests.PersistAndRestore"
        shell: bash
        working-directory: ${{ github.workspace }}/csharp

  test_csharp_windows_x86:
    name: Test C# on Windows x86 with Visual Studio 2026
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Pull Git Submodules
        run: git submodule update --init --recursive
      - name: Build the Shared C Library
        run: |
          cmake --preset msvc2026_x64
          cmake --build --preset msvc2026_x64 --target usearch_shared
      - name: Set Up .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Test .NET
        run: |
          mkdir -p "${{ github.workspace }}\csharp\lib\runtimes\win-x64\native"
          cp "${{ github.workspace }}\build_msvc2026_x64\libusearch_shared.dll" "${{ github.workspace }}\csharp\lib\runtimes\win-x64\native"
          dotnet test -c Debug --logger "console;verbosity=detailed"
        shell: bash
        working-directory: ${{ github.workspace }}/csharp
