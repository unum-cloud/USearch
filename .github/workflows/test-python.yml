name: Test Python

on:
  workflow_call:

permissions:
  contents: read

env:
  PYTHON_VERSION: 3.12
  PYTHONUTF8: 1
  PYTHONFAULTHANDLER: 1

jobs:
  test_python_ubuntu_gcc:
    name: Test Python on Ubuntu with GCC 14
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      CC: gcc-14
      CXX: g++-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Pull Git Submodules
        run: git submodule update --init --recursive
      - name: Install Toolchain
        run: |
          sudo apt update
          sudo apt install -y build-essential g++-14 lld libjemalloc-dev libomp-dev
      - name: Set Up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group test .
      - name: Test Python
        run: python -X faulthandler -m pytest -x

  test_python_ubuntu_clang:
    name: Test Python on Ubuntu with Clang 20
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      CC: clang-20
      CXX: clang++-20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Pull Git Submodules
        run: git submodule update --init --recursive
      - name: Install Toolchain
        run: |
          sudo apt update
          sudo apt install -y build-essential clang-20 lld libjemalloc-dev
      - name: Set Up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group test .
        env:
          CXX: clang++
          CC: clang++ # Override the default compiler
      - name: Test Python
        run: python -X faulthandler -m pytest -x

  test_python_macos:
    name: Test Python on macOS
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Pull Git Submodules
        run: git submodule update --init --recursive
      - name: Set Up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group test .
        env:
          CXX: clang++
          CC: clang++ # Override the default compiler
      - name: Test Python
        run: python -X faulthandler -m pytest -x

  test_python_windows_x86:
    name: Test Python on Windows x86 with Visual Studio 2026
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Pull Git Submodules
        run: git submodule update --init --recursive
      - name: Set Up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group test .
      - name: Test Python
        run: python -X faulthandler -m pytest -x

  # The native Python builds on every OS fail in minutes, before dozens of cibuildwheel jobs start.
  wheels:
    name: Build Python Wheels
    needs: [test_python_ubuntu_gcc, test_python_ubuntu_clang, test_python_macos, test_python_windows_x86]
    uses: ./.github/workflows/build-wheels.yml
    with:
      smoke: true
