name: Release

on:
  push:
    branches: ["main"]

env:
  GH_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
  PYTHONUTF8: 1
  PYTHON_VERSION: 3.12
  DOTNET_VERSION: 10.0.x
  NODE_VERSION: 22
  JAVA_VERSION: 25
  GO_VERSION: "^1.22.0"
  ANDROID_NDK_VERSION: 26.3.11579264
  ANDROID_SDK_VERSION: 21
  EMSCRIPTEN_VERSION: 6.0.9
  MINGW_VERSION: 12.2.0
  WASI_SDK_VERSION: "34"

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write
  packages: write

jobs:
  # The files the release commit bumps that land in the Swift artifacts: the headers' version macros and the bundle's.
  bump_swift_version:
    name: Bump Swift Artifacts Version
    if: github.repository == 'unum-cloud/USearch'
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bump Version
        uses: ashvardanian/tinysemver@v3
        with:
          version-file: "VERSION"
          update-version-in: |
            CMakeLists.txt:VERSION (\d+\.\d+\.\d+(?:-rc\.\d+)?)
          update-major-version-in: |
            c/usearch/types.h:^#define USEARCH_VERSION_MAJOR (\d+)
          update-minor-version-in: |
            c/usearch/types.h:^#define USEARCH_VERSION_MINOR (\d+)
          update-patch-version-in: |
            c/usearch/types.h:^#define USEARCH_VERSION_PATCH (\d+)
          dry-run: "false"
      - name: Upload Bumped Files
        uses: actions/upload-artifact@v7
        with:
          name: swift-version
          path: |
            VERSION
            CMakeLists.txt
            c/usearch/types.h
          if-no-files-found: error
          retention-days: 1

  # Each build adds its slice, and `lipo` joins the architectures of one SDK. The simulators' runtimes and the 32-bit
  # watchOS one lack the `__sme_memset` routine streaming SME code calls, so those go without NumKong's SME kernels.
  build_swift_xcframework:
    name: Build Swift XCFramework
    needs: bump_swift_version
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Take the Release Version
        uses: actions/download-artifact@v8
        with:
          name: swift-version
          path: .
      - name: Build Every Apple Slice
        run: |
          set -euo pipefail
          no_sme="-D NUMKONG_TARGET_SME=0 -D NUMKONG_TARGET_SMEF64=0 -D NUMKONG_TARGET_SMEBI32=0"
          slice() {
            local name=$1
            shift
            cmake -S . -B "build_$name" --preset swift -D USEARCH_SWIFT_DIRECTORY="$PWD/build_swift" "$@"
            cmake --build "build_$name"
          }
          for arch in arm64 x86_64; do
            slice "macos_$arch" -D CMAKE_OSX_ARCHITECTURES=$arch
            slice "catalyst_$arch" -D USEARCH_SWIFT_SDK=maccatalyst -D CMAKE_OSX_ARCHITECTURES=$arch \
              -D "CMAKE_C_FLAGS=-target $arch-apple-ios18.0-macabi" -D "CMAKE_CXX_FLAGS=-target $arch-apple-ios18.0-macabi"
            slice "iossim_$arch" -D CMAKE_SYSTEM_NAME=iOS -D CMAKE_OSX_SYSROOT=iphonesimulator \
              -D USEARCH_SWIFT_SDK=iphonesimulator -D CMAKE_OSX_ARCHITECTURES=$arch -D CMAKE_OSX_DEPLOYMENT_TARGET=18.0 $no_sme
            slice "tvossim_$arch" -D CMAKE_SYSTEM_NAME=tvOS -D CMAKE_OSX_SYSROOT=appletvsimulator \
              -D USEARCH_SWIFT_SDK=appletvsimulator -D CMAKE_OSX_ARCHITECTURES=$arch -D CMAKE_OSX_DEPLOYMENT_TARGET=18.0 $no_sme
            slice "watchsim_$arch" -D CMAKE_SYSTEM_NAME=watchOS -D CMAKE_OSX_SYSROOT=watchsimulator \
              -D USEARCH_SWIFT_SDK=watchsimulator -D CMAKE_OSX_ARCHITECTURES=$arch -D CMAKE_OSX_DEPLOYMENT_TARGET=11.0 $no_sme
            slice "xrsim_$arch" -D CMAKE_SYSTEM_NAME=visionOS -D CMAKE_OSX_SYSROOT=xrsimulator \
              -D USEARCH_SWIFT_SDK=xrsimulator -D CMAKE_OSX_ARCHITECTURES=$arch -D CMAKE_OSX_DEPLOYMENT_TARGET=2.0 $no_sme
          done
          slice watchos_arm64_32 -D CMAKE_SYSTEM_NAME=watchOS -D CMAKE_OSX_SYSROOT=watchos -D USEARCH_SWIFT_SDK=watchos \
            -D CMAKE_OSX_ARCHITECTURES=arm64_32 -D CMAKE_OSX_DEPLOYMENT_TARGET=11.0 $no_sme
          slice watchos_arm64 -D CMAKE_SYSTEM_NAME=watchOS -D CMAKE_OSX_SYSROOT=watchos -D USEARCH_SWIFT_SDK=watchos \
            -D CMAKE_OSX_ARCHITECTURES=arm64 -D CMAKE_OSX_DEPLOYMENT_TARGET=11.0
          slice ios -D CMAKE_SYSTEM_NAME=iOS -D CMAKE_OSX_SYSROOT=iphoneos -D USEARCH_SWIFT_SDK=iphoneos \
            -D CMAKE_OSX_ARCHITECTURES=arm64 -D CMAKE_OSX_DEPLOYMENT_TARGET=18.0
          slice tvos -D CMAKE_SYSTEM_NAME=tvOS -D CMAKE_OSX_SYSROOT=appletvos -D USEARCH_SWIFT_SDK=appletvos \
            -D CMAKE_OSX_ARCHITECTURES=arm64 -D CMAKE_OSX_DEPLOYMENT_TARGET=18.0
          slice xros -D CMAKE_SYSTEM_NAME=visionOS -D CMAKE_OSX_SYSROOT=xros -D USEARCH_SWIFT_SDK=xros \
            -D CMAKE_OSX_ARCHITECTURES=arm64 -D CMAKE_OSX_DEPLOYMENT_TARGET=2.0
          (cd build_swift && zip -qry ../USearchC.xcframework.zip USearchC.xcframework)
      - name: Upload XCFramework
        uses: actions/upload-artifact@v7
        with:
          name: swift-xcframework
          path: USearchC.xcframework.zip
          if-no-files-found: error
          retention-days: 7

  build_swift_linux:
    name: Build Swift Artifact Bundle for Linux ${{ matrix.arch }}
    needs: bump_swift_version
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    container: swift:6.4
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - name: Install CMake
        run: apt-get update && apt-get install -y cmake ninja-build
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Take the Release Version
        uses: actions/download-artifact@v8
        with:
          name: swift-version
          path: .
      - name: Build Artifact Bundle
        run: |
          cmake --preset swift -D CMAKE_C_COMPILER=clang -D CMAKE_CXX_COMPILER=clang++
          cmake --build --preset swift
      # SE-0482 admits libraries that need nothing beyond the C library and runtime.
      - name: Audit Artifact Bundle
        run: swift package experimental-audit-binary-artifact build_swift/USearchC.artifactbundle
      - name: Upload Artifact Bundle
        uses: actions/upload-artifact@v7
        with:
          name: swift-part-linux-${{ matrix.arch }}
          path: build_swift/USearchC.artifactbundle
          if-no-files-found: error
          retention-days: 1

  # Swift on Windows links the MSVC ABI, so the archive comes from `cl`, which only a developer prompt puts on the
  # `PATH` for the Ninja generator the preset picks.
  build_swift_windows:
    name: Build Swift Artifact Bundle for Windows ${{ matrix.arch }}
    needs: bump_swift_version
    runs-on: ${{ matrix.arch == 'aarch64' && 'windows-11-arm' || 'windows-2025' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Take the Release Version
        uses: actions/download-artifact@v8
        with:
          name: swift-version
          path: .
      - name: Set Up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch == 'aarch64' && 'arm64' || 'x64' }}
      - name: Build Artifact Bundle
        run: |
          cmake --preset swift -D CMAKE_C_COMPILER=cl -D CMAKE_CXX_COMPILER=cl -D USEARCH_SWIFT_TRIPLES=${{ matrix.arch }}-unknown-windows-msvc
          cmake --build --preset swift
      - name: Upload Artifact Bundle
        uses: actions/upload-artifact@v7
        with:
          name: swift-part-windows-${{ matrix.arch }}
          path: build_swift/USearchC.artifactbundle
          if-no-files-found: error
          retention-days: 1

  # One archive per ABI at the Swift SDK's lowest API level, serving every level the SDK names.
  build_swift_android:
    name: Build Swift Artifact Bundle for Android
    needs: bump_swift_version
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Take the Release Version
        uses: actions/download-artifact@v8
        with:
          name: swift-version
          path: .
      - name: Install NDK
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${{ env.ANDROID_NDK_VERSION }}"
      - name: Build Artifact Bundle
        run: |
          set -euo pipefail
          abi() {
            local abi=$1 arch=$2
            cmake -S . -B "build_$abi" --preset swift -D USEARCH_SWIFT_DIRECTORY="$PWD/build_swift" \
              -D CMAKE_TOOLCHAIN_FILE="${ANDROID_HOME}/ndk/${{ env.ANDROID_NDK_VERSION }}/build/cmake/android.toolchain.cmake" \
              -D ANDROID_ABI="$abi" -D ANDROID_PLATFORM=android-23 \
              -D USEARCH_SWIFT_TRIPLES="$(seq -f "$arch-unknown-linux-android%g" -s ';' 23 36)"
            cmake --build "build_$abi"
          }
          abi arm64-v8a aarch64
          abi armeabi-v7a armv7
          abi x86_64 x86_64
      - name: Upload Artifact Bundle
        uses: actions/upload-artifact@v7
        with:
          name: swift-part-android
          path: build_swift/USearchC.artifactbundle
          if-no-files-found: error
          retention-days: 1

  # Strict SIMD128, which every SIMD engine validates, as one archive serves every Swift WASI module.
  build_swift_wasi:
    name: Build Swift Artifact Bundle for WebAssembly WASI
    needs: bump_swift_version
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Take the Release Version
        uses: actions/download-artifact@v8
        with:
          name: swift-version
          path: .
      - name: Install WASI SDK
        run: |
          curl -sSL "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_VERSION}/wasi-sdk-${WASI_SDK_VERSION}.0-x86_64-linux.tar.gz" \
            | tar xz -C "$HOME"
          echo "WASI_SDK_PATH=$HOME/wasi-sdk-${WASI_SDK_VERSION}.0-x86_64-linux" >> "$GITHUB_ENV"
      - name: Build Artifact Bundle
        run: |
          cmake --preset swift -D CMAKE_TOOLCHAIN_FILE=cmake/toolchain-wasm32-wasi.cmake \
            -D USEARCH_SWIFT_TRIPLES=wasm32-unknown-wasip1
          cmake --build --preset swift
      - name: Upload Artifact Bundle
        uses: actions/upload-artifact@v7
        with:
          name: swift-part-wasi
          path: build_swift/USearchC.artifactbundle
          if-no-files-found: error
          retention-days: 1

  # Each part's variants go through the same CMake script that wrote them, into one bundle.
  merge_swift_artifact_bundle:
    name: Merge Swift Artifact Bundle
    needs: [build_swift_linux, build_swift_windows, build_swift_android, build_swift_wasi]
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Download Artifact Bundle Parts
        uses: actions/download-artifact@v8
        with:
          pattern: swift-part-*
          path: parts
      - name: Merge Artifact Bundle Parts
        run: |
          set -euo pipefail
          for part in parts/*; do
            version=$(jq -r '.artifacts.USearchC.version' "$part/info.json")
            jq -r '.artifacts.USearchC.variants[] | [.path, (.supportedTriples | join(","))] | @tsv' "$part/info.json" |
              while IFS=$'\t' read -r path triples; do
                cmake -D NUMKONG_SWIFT_MODULE=USearchC -D NUMKONG_SWIFT_ARCHIVE="$part/$path" \
                  -D NUMKONG_SWIFT_HEADERS="$part/include" -D NUMKONG_SWIFT_DIRECTORY="$PWD/merged" \
                  -D NUMKONG_SWIFT_TRIPLES="$triples" -D NUMKONG_SWIFT_VERSION="$version" \
                  -P numkong/cmake/numkong_swift_artifact.cmake
              done
          done
          (cd merged && zip -qry ../USearchC.artifactbundle.zip USearchC.artifactbundle)
      - name: Upload Artifact Bundle
        uses: actions/upload-artifact@v7
        with:
          name: swift-artifactbundle
          path: USearchC.artifactbundle.zip
          if-no-files-found: error
          retention-days: 7

  # `Package.swift` names the Swift artifacts by URL and checksum, so the release commit carries both and the
  # artifacts join the release it creates.
  versioning:
    name: Update Version
    # Every other job needs this one, so a private fork never tags, releases or publishes.
    if: github.repository == 'unum-cloud/USearch'
    needs: [build_swift_xcframework, merge_swift_artifact_bundle]
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download Swift Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: swift-{xcframework,artifactbundle}
          path: ${{ runner.temp }}/swift
          merge-multiple: true
      - name: Write Swift Checksums
        run: |
          apple=$(sha256sum "$RUNNER_TEMP"/swift/*.xcframework.zip | cut -c -64)
          portable=$(sha256sum "$RUNNER_TEMP"/swift/*.artifactbundle.zip | cut -c -64)
          sed -i "s/^let appleChecksum = .*/let appleChecksum = \"$apple\"/" Package.swift
          sed -i "s/^let portableChecksum = .*/let portableChecksum = \"$portable\"/" Package.swift
      - name: Run TinySemVer
        uses: ashvardanian/tinysemver@v3
        with:
          verbose: "true"
          version-file: "VERSION"
          update-version-in: |
            package.json:"version": "(\d+\.\d+\.\d+(?:-rc\.\d+)?)"
            CITATION.cff:^version: (\d+\.\d+\.\d+(?:-rc\.\d+)?)
            Cargo.toml:^version = "(\d+\.\d+\.\d+(?:-rc\.\d+)?)"
            conanfile.py:version = "(\d+\.\d+\.\d+(?:-rc\.\d+)?)"
            java/README.md:usearchVersion = '(\d+\.\d+\.\d+(?:-rc\.\d+)?)'
            java/README.md:version: '(\d+\.\d+\.\d+(?:-rc\.\d+)?)'
            README.md:version = {(\d+\.\d+\.\d+(?:-rc\.\d+)?)}
            csharp/nuget/nuget-package.props:>(\d+\.\d+\.\d+(?:-rc\.\d+)?)</Version>
            CMakeLists.txt:VERSION (\d+\.\d+\.\d+(?:-rc\.\d+)?)
            Package.swift:releases/download/v(\d+\.\d+\.\d+(?:-rc\.\d+)?)
          update-major-version-in: |
            c/usearch/types.h:^#define USEARCH_VERSION_MAJOR (\d+)
          update-minor-version-in: |
            c/usearch/types.h:^#define USEARCH_VERSION_MINOR (\d+)
          update-patch-version-in: |
            c/usearch/types.h:^#define USEARCH_VERSION_PATCH (\d+)
          dry-run: "false"
          push: "true"
          create-release: "true"
          github-token: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
      - name: Upload Swift Artifacts
        run: git diff --quiet HEAD~1 HEAD -- VERSION || gh release upload "v$(cat VERSION)" "$RUNNER_TEMP"/swift/*.zip

  sync_dev:
    name: Sync Development Branch
    needs: versioning
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout the latest code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Checkout's persisted credential carries the push, so it must be the ruleset-bypassing PAT.
          token: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}

      - name: Sync development branch with released main
        run: |
          git fetch origin main main-dev
          # Squash merges leave main-dev with the released tree under other hashes, which is safe to reset.
          git merge-base --is-ancestor origin/main-dev origin/main || git diff --quiet ${{ github.sha }} origin/main-dev
          git push --force-with-lease=main-dev:origin/main-dev origin origin/main:refs/heads/main-dev

  create_linux_deb_package:
    name: Build Linux Package for ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    needs: versioning
    env:
      CC: clang
      CXX: clang++
      AR: llvm-ar
      NM: llvm-nm
      RANLIB: llvm-ranlib

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-linux-gnu
          - arch: arm64
            target: aarch64-linux-gnu

    steps:
      - name: Check out refreshed version
        uses: actions/checkout@v7
        with:
          ref: "main"
      - name: Pull Git submodules
        run: git submodule update --init --recursive

      - name: Get version
        id: set_version
        run: |
          version=$(cat VERSION)
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld make crossbuild-essential-arm64 crossbuild-essential-armhf libjemalloc-dev

      - name: Build C/C++
        run: |
          # Configure and build the project
          cmake --preset library -B build_release \
            -D CMAKE_C_COMPILER_TARGET=${{ matrix.target }} \
            -D CMAKE_CXX_COMPILER_TARGET=${{ matrix.target }} \
            -D CMAKE_SYSTEM_NAME=Linux \
            -D CMAKE_SYSTEM_PROCESSOR=${{ matrix.arch }}

          cmake --build build_release

          cp build_release/libusearch_shared.so "usearch_linux_${{ matrix.arch }}_${{ steps.set_version.outputs.version }}.so"

          mkdir -p "usearch_linux_${{ matrix.arch }}_${{ steps.set_version.outputs.version }}/DEBIAN"
          touch "usearch_linux_${{ matrix.arch }}_${{ steps.set_version.outputs.version }}/DEBIAN/control"
          mkdir -p "usearch_linux_${{ matrix.arch }}_${{ steps.set_version.outputs.version }}/usr/local/lib"
          mkdir "usearch_linux_${{ matrix.arch }}_${{ steps.set_version.outputs.version }}/usr/local/include"
          for root in c include cpp; do
            cp -r $root/usearch "usearch_linux_${{ matrix.arch }}_${{ steps.set_version.outputs.version }}/usr/local/include/"
          done
          cp build_release/libusearch_shared.so "usearch_linux_${{ matrix.arch }}_${{ steps.set_version.outputs.version }}/usr/local/lib/"
          echo -e "Package: usearch\nVersion: ${{ steps.set_version.outputs.version }}\nMaintainer: Ash Vardanian\nArchitecture: ${{ matrix.arch }}\nDescription: Faster & Smaller Single-File Search Engine for Vectors & Texts" > "usearch_linux_${{ matrix.arch }}_${{ steps.set_version.outputs.version }}/DEBIAN/control"
          dpkg-deb --build "usearch_linux_${{ matrix.arch }}_${{ steps.set_version.outputs.version }}"

      - name: Upload native library for Java
        uses: actions/upload-artifact@v7
        with:
          name: native-libs-linux-${{ matrix.arch }}
          path: build_release/libusearch_shared.so
          retention-days: 1

      - name: Upload library
        uses: xresloader/upload-to-github-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          file: "*.so;*.deb"
          update_latest_release: true

  create_windows_dll_library:
    name: Build Windows Library for ${{ matrix.arch }}
    runs-on: windows-2025
    needs: versioning
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86, arm64]
    steps:
      - name: Check out refreshed version
        uses: actions/checkout@v7
        with:
          ref: "main"
      - name: Pull Git submodules
        run: git submodule update --init --recursive

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Setup MinGW
        if: matrix.arch != 'arm64'
        uses: egor-tensin/setup-mingw@v3
        with:
          platform: ${{ matrix.arch }}
          version: ${{ env.MINGW_VERSION }}

      - name: Setup MSVC for ARM64
        if: matrix.arch == 'arm64'
        uses: microsoft/setup-msbuild@v3

      - name: Get version
        id: set_version
        shell: bash
        run: |
          version=$(cat VERSION)
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Build library with MinGW
        if: matrix.arch != 'arm64'
        run: |
          cmake -DCMAKE_BUILD_TYPE=Release -DUSEARCH_BUILD_SHARED=1 -DUSEARCH_DENSE_DTYPES=11 -B ./build_release
          cmake --build ./build_release --config Release
          mkdir pkg
          copy .\build_release\libusearch_shared.dll pkg\
          xcopy /E /I .\c\usearch pkg\usearch
          xcopy /E /I .\include\usearch pkg\usearch
          xcopy /E /I .\cpp\usearch pkg\usearch
          tar -cf usearch_windows_${{ matrix.arch }}_${{ steps.set_version.outputs.version }}.tar -C pkg libusearch_shared.dll usearch

      - name: Build library with MSVC for Arm64
        if: matrix.arch == 'arm64'
        run: |
          cmake --preset msvc2022_arm64 -B ./build_release
          cmake --build ./build_release --config Release
          mkdir pkg
          copy .\build_release\libusearch_shared.dll pkg\
          xcopy /E /I .\c\usearch pkg\usearch
          xcopy /E /I .\include\usearch pkg\usearch
          xcopy /E /I .\cpp\usearch pkg\usearch
          tar -cf usearch_windows_${{ matrix.arch }}_${{ steps.set_version.outputs.version }}.tar -C pkg libusearch_shared.dll usearch

      - name: Upload native library for Java
        uses: actions/upload-artifact@v7
        with:
          name: native-libs-windows-${{ matrix.arch }}
          path: build_release/libusearch_shared.dll
          retention-days: 1

      - name: Upload archive
        uses: xresloader/upload-to-github-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          file: "usearch_windows_${{ matrix.arch }}_${{ steps.set_version.outputs.version }}.tar"
          update_latest_release: true

  create_macos_dylib_library:
    name: Build macOS Library for ${{ matrix.arch }}
    runs-on: macos-26
    needs: versioning
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    steps:
      - name: Check out refreshed version
        uses: actions/checkout@v7
        with:
          ref: "main"
      - name: Pull Git submodules
        run: git submodule update --init --recursive

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Get version
        id: set_version
        run: |
          version=$(cat VERSION)
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Build library
        run: |
          cmake --preset library -B ./build_release -D CMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}
          cmake --build ./build_release
          mkdir pkg
          cp build_release/libusearch_shared.dylib pkg/
          for root in c include cpp; do cp -r $root/usearch pkg/; done
          (cd pkg && zip -r ../usearch_macos_${{ matrix.arch }}_${{ steps.set_version.outputs.version }}.zip libusearch_shared.dylib usearch)

      - name: Upload native library for Java
        uses: actions/upload-artifact@v7
        with:
          name: native-libs-macos-${{ matrix.arch }}
          path: build_release/libusearch_shared.dylib
          retention-days: 1

      - name: Upload library
        uses: xresloader/upload-to-github-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          file: "*.dylib"
          update_latest_release: true

      - name: Upload archive
        uses: xresloader/upload-to-github-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          file: "*.zip"
          update_latest_release: true

  create_android_library:
    name: Build Android Library for ${{ matrix.abi }}
    runs-on: ubuntu-26.04
    needs: versioning
    strategy:
      fail-fast: false
      matrix:
        include:
          - processor: armv7a
            abi: armeabi-v7a
            target: armv7-linux-androideabi
            arch: arm32
            preset: android_armv7
          - processor: aarch64
            abi: arm64-v8a
            target: aarch64-linux-android
            arch: arm64
            preset: android_arm64

    steps:
      - name: Check out refreshed version
        uses: actions/checkout@v7
        with:
          ref: "main"
      - name: Pull Git submodules
        run: git submodule update --init --recursive

      - name: Get version
        id: set_version
        run: |
          version=$(cat VERSION)
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Install NDK
        run: |
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;${{ env.ANDROID_NDK_VERSION }}"

      - name: Build C/C++
        run: |
          export ANDROID_NDK_ROOT="${ANDROID_HOME}/ndk/${{ env.ANDROID_NDK_VERSION }}"
          cmake --preset ${{ matrix.preset }} -B build_artifacts -D ANDROID_PLATFORM=${{ env.ANDROID_SDK_VERSION }}
          cmake --build build_artifacts

      - name: Package library
        run: |
          mkdir pkg
          cp build_artifacts/libusearch_shared.so pkg/
          for root in c include cpp; do cp -r $root/usearch pkg/; done
          (cd pkg && zip -r ../usearch_android_${{ matrix.arch }}_${{ steps.set_version.outputs.version }}.zip libusearch_shared.so usearch)

      - name: Upload native library for Java
        uses: actions/upload-artifact@v7
        with:
          name: native-libs-android-${{ matrix.arch }}
          path: build_artifacts/libusearch_shared.so
          retention-days: 1

      - name: Upload archive
        uses: xresloader/upload-to-github-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          file: "*.zip"
          update_latest_release: true

  build_jni_linux:
    name: Build JNI for Linux ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    needs: versioning
    # `-target <triple>` is a Clang flag; without these, CMake picks the host
    # GCC and silently drops the cross-target. Mirrors the prerelease
    # `test_ubuntu_cross_compilation` job.
    env:
      CC: clang
      CXX: clang++
      AR: llvm-ar
      NM: llvm-nm
      RANLIB: llvm-ranlib
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            cmake_processor: x86_64
            target: x86_64-linux-gnu
            expected_arch: x86-64
          - arch: arm64
            cmake_processor: aarch64
            target: aarch64-linux-gnu
            expected_arch: aarch64

    steps:
      - name: Check out refreshed version
        uses: actions/checkout@v7
        with:
          ref: "main"
      - name: Pull Git submodules
        run: git submodule update --init --recursive

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "adopt"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld make crossbuild-essential-arm64 crossbuild-essential-armhf

      - name: Build JNI library
        run: |
          cmake -B build_artifacts \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_TARGET=${{ matrix.target }} \
            -DCMAKE_CXX_COMPILER_TARGET=${{ matrix.target }} \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=${{ matrix.cmake_processor }} \
            -DUSEARCH_BUILD_SHARED=1 \
            -DUSEARCH_DENSE_DTYPES=11

          cmake --build build_artifacts --config Release -j

      # Guard against silent host-toolchain fallback — the binary must actually
      # be for the target arch, otherwise packaging will ship a broken library.
      - name: Verify target architecture
        run: |
          file build_artifacts/libusearch_java.so | grep -q '${{ matrix.expected_arch }}'

      - name: Upload JNI library artifact
        uses: actions/upload-artifact@v7
        with:
          name: usearch-jni-linux-${{ matrix.arch }}
          path: build_artifacts/libusearch_java.so
          retention-days: 1

  build_jni_windows:
    name: Build JNI for Windows ${{ matrix.arch }}
    runs-on: windows-2025
    needs: versioning
    # Only x64 is supported today. 32-bit MSVC leaves NumKong's SIMD backends
    # undefined, and ARM64 MSVC hits a stale `<immintrin.h>` include in
    # NumKong — both require upstream fixes.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            cmake_arch: x64

    steps:
      - name: Check out refreshed version
        uses: actions/checkout@v7
        with:
          ref: "main"
      - name: Pull Git submodules
        run: git submodule update --init --recursive

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "adopt"

      - name: Build JNI library
        run: |
          cmake -B build_artifacts -A ${{ matrix.cmake_arch }} `
            -DCMAKE_BUILD_TYPE=Release `
            -DUSEARCH_BUILD_SHARED=1 `
            -DUSEARCH_DENSE_DTYPES=11

          cmake --build build_artifacts --config Release

      - name: Upload JNI library artifact
        uses: actions/upload-artifact@v7
        with:
          name: usearch-jni-windows-${{ matrix.arch }}
          path: build_artifacts/libusearch_java.dll
          retention-days: 1

  build_jni_macos:
    name: Build JNI for macOS ${{ matrix.arch }}
    runs-on: macos-26
    needs: versioning
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            cmake_arch: x86_64
          - arch: arm64
            cmake_arch: arm64

    steps:
      - name: Check out refreshed version
        uses: actions/checkout@v7
        with:
          ref: "main"
      - name: Pull Git submodules
        run: git submodule update --init --recursive

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "adopt"

      - name: Build JNI library
        run: |
          cmake -B build_artifacts \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.cmake_arch }} \
            -DCMAKE_SYSTEM_NAME=Darwin \
            -DCMAKE_SYSTEM_PROCESSOR=${{ matrix.cmake_arch }} \
            -DUSEARCH_BUILD_SHARED=1 \
            -DUSEARCH_DENSE_DTYPES=11

          cmake --build build_artifacts --config Release

      - name: Verify target architecture
        run: |
          file build_artifacts/libusearch_java.dylib | grep -q '${{ matrix.cmake_arch }}'

      - name: Upload JNI library artifact
        uses: actions/upload-artifact@v7
        with:
          name: usearch-jni-macos-${{ matrix.arch }}
          path: build_artifacts/libusearch_java.dylib
          retention-days: 1

  build_jni_android:
    name: Build JNI for Android ${{ matrix.abi }}
    runs-on: ubuntu-26.04
    needs: versioning
    strategy:
      fail-fast: false
      matrix:
        include:
          - processor: armv7a
            abi: armeabi-v7a
            arch: arm32
          - processor: aarch64
            abi: arm64-v8a
            arch: arm64

    steps:
      - name: Check out refreshed version
        uses: actions/checkout@v7
        with:
          ref: "main"
      - name: Pull Git submodules
        run: git submodule update --init --recursive

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "adopt"

      - name: Install NDK
        run: |
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;${{ env.ANDROID_NDK_VERSION }}"

      - name: Build JNI library
        run: |
          cmake -B build_artifacts \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=${ANDROID_HOME}/ndk/${{ env.ANDROID_NDK_VERSION }}/build/cmake/android.toolchain.cmake \
            -DCMAKE_ANDROID_STL_TYPE=c++_static \
            -DANDROID_PLATFORM=${{ env.ANDROID_SDK_VERSION }} \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DUSEARCH_BUILD_SHARED=1 \
            -DUSEARCH_DENSE_DTYPES=11

          cmake --build build_artifacts --config Release

      - name: Upload JNI library artifact
        uses: actions/upload-artifact@v7
        with:
          name: usearch-jni-android-${{ matrix.arch }}
          path: build_artifacts/libusearch_java.so
          retention-days: 1

  # One archive per checked-in Emscripten toolchain: a WebAssembly module carries one SIMD tier, width and threads
  # choice, so each row is a whole build, and its C test runs under Node before anything is packed.
  create_wasm_library:
    name: Build WASM Library for ${{ matrix.archive }}
    runs-on: ubuntu-26.04
    needs: versioning
    strategy:
      fail-fast: false
      matrix:
        include:
          - { archive: wasm32_emscripten, node: 22 }
          - { archive: wasm64_emscripten, node: 24 }
    steps:
      - name: Check out refreshed version
        uses: actions/checkout@v7
        with:
          ref: "main"
      - name: Pull Git submodules
        run: git submodule update --init --recursive

      - name: Get version
        id: set_version
        run: |
          version=$(cat VERSION)
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v16
        with:
          version: ${{ env.EMSCRIPTEN_VERSION }}
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Build and test WASM with CMake
        run: |
          cmake --workflow --preset ${{ matrix.archive }}

          cd build_${{ matrix.archive }}
          for root in c include cpp; do cp -r ../$root/usearch .; done
          tar -czf ../usearch_${{ matrix.archive }}_${{ steps.set_version.outputs.version }}.tar.gz libusearch_static.a usearch
          zip -r ../usearch_${{ matrix.archive }}_${{ steps.set_version.outputs.version }}.zip libusearch_static.a usearch

      - name: Upload archives
        uses: xresloader/upload-to-github-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          file: "usearch_${{ matrix.archive }}_*.tar.gz;usearch_${{ matrix.archive }}_*.zip"
          update_latest_release: true

  publish_checksums:
    name: Compute Assets Checksums
    runs-on: ubuntu-26.04
    needs:
      [
        versioning,
        create_linux_deb_package,
        create_windows_dll_library,
        create_macos_dylib_library,
        create_android_library,
        create_wasm_library,
        publish_java,
        build_docs,
      ]
    steps:
      - name: Get last release ID
        id: last_release
        run: |
          response=$(curl -s -H "Authorization: Bearer ${{ secrets.SEMANTIC_RELEASE_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/latest")
          echo "last_release_id=$(echo "$response" | jq -r '.id')" >> $GITHUB_OUTPUT

      - name: Download release assets
        uses: robinraju/release-downloader@v1.13
        with:
          latest: true
          fileName: "*"
          out-file-path: "downloads"
          tarBall: true
          zipBall: true

      - name: Generate hash list
        id: hash_list
        run: |
          cd $GITHUB_WORKSPACE/downloads
          {
            echo "## Hashes"
            for asset_name in $(ls); do
              asset_hash=$(sha256sum $asset_name | awk '{print $1}')
              echo "* $asset_name : \`$asset_hash\`"
            done
          } > hashes.md
          echo "hash_body<<EOF" >> $GITHUB_OUTPUT
          cat hashes.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Upload hashes to release
        uses: irongut/EditRelease@v1.2.0
        with:
          token: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
          id: ${{ steps.last_release.outputs.last_release_id }}
          prerelease: false
          replacebody: false
          body: ${{ steps.hash_list.outputs.hash_body }}

  build_wheels:
    name: Build Python Wheels for ${{ matrix.os }} cp${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    needs: versioning
    strategy:
      matrix:
        os: [ubuntu-26.04, ubuntu-26.04-arm, macos-26, windows-2025]
        python-version:
          ["312", "313", "314", "314t", "315", "315t"]
    steps:
      - name: Check out refreshed version
        uses: actions/checkout@v7
        with:
          ref: "main"
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel
      - name: Build wheels
        run: cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: cp${{ matrix.python-version }}-*
          CIBW_ARCHS_LINUX: native
          CIBW_TEST_SKIP: "*-win_arm64" # Too complex to emulate Windows ARM
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl
          overwrite: true

  publish_python:
    name: Publish Python
    needs: build_wheels
    runs-on: ubuntu-26.04
    environment:
      name: pypi
      url: https://pypi.org/p/usearch
    permissions:
      id-token: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          # unpacks all CIBW artifacts into dist/
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Publish to PyPi
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          verbose: true
          print-hash: true

  build_javascript:
    name: Build JavaScript Native Modules for ${{ matrix.os }} ${{ matrix.arch }}
    needs: versioning
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
        # Windows pre-build is not working
        # - windows-latest
        os: [macos-26, ubuntu-26.04]
        exclude:
          - arch: x86
            os: macos-26
          - arch: x86
            os: ubuntu-26.04
    runs-on: ${{ matrix.os }}
    env:
      CC: gcc
      CXX: g++

    steps:
      - name: Checkout the latest code
        uses: actions/checkout@v7
        with:
          ref: "main"
      - name: Pull Git submodules
        run: git submodule update --init --recursive

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          architecture: ${{ matrix.arch }}

      - name: Update compilers
        if: matrix.os == 'ubuntu-26.04'
        run: |
          sudo apt update
          sudo apt install -y cmake build-essential libjemalloc-dev libomp-dev
          sudo apt install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu g++-aarch64-linux-gnu
        # NPM installation fails spuriously all the time
      - name: Install Dependencies
        run: |
          npm install --ignore-scripts
      - name: Prebuild for one target
        run: npm run prebuild
        if: matrix.os != 'macos-26'
      - name: Prebuild for both macOS architectures
        run: npm run prebuild && npm run prebuild-arm64
        env:
          CC: clang
          CXX: clang++
        if: matrix.os == 'macos-26'
      - name: Inspect the prebuilt binaries
        run: file prebuilds/*/*
        if: matrix.os == 'macos-26'
      - name: Extra for cross build
        if: matrix.os == 'ubuntu-26.04'
        env:
          CC: aarch64-linux-gnu-gcc
          CXX: aarch64-linux-gnu-g++
          AR: aarch64-linux-gnu-ar
          AS: aarch64-linux-gnu-as
          LD: aarch64-linux-gnu-ld
          STRIP: aarch64-linux-gnu-strip
        run: |
          npm run prebuild-arm64
          aarch64-linux-gnu-strip prebuilds/linux-arm64/*node
      - name: Upload prebuilds
        uses: actions/upload-artifact@v7
        with:
          name: prebuilds-${{ matrix.os }}-${{ matrix.arch }}
          path: prebuilds
          retention-days: 1

  publish_javascript:
    name: Publish JavaScript
    needs: build_javascript
    runs-on: ubuntu-26.04
    environment:
      name: npm-usearch
      url: https://www.npmjs.com/package/usearch
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out refreshed version
        uses: actions/checkout@v7
        with:
          ref: "main"
      - name: Pull Git submodules
        run: git submodule update --init --recursive

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Download prebuilds
        uses: actions/download-artifact@v8
        with:
          pattern: prebuilds-*
          merge-multiple: true
          path: prebuilds

      - name: Look for links
        run: find . -type f -links +1

        # NPM installation fails spuriously all the time
      - name: Install Dependencies
        run: |
          npm install --ignore-scripts

      - name: Build the JS from TS
        run: npm run build-js

      - name: Last minute test with prebuild artifact
        run: npm run test

      - name: Publish Dry Run
        run: npm publish --dry-run

      - name: Publish
        run: npm publish --provenance --access public

  publish_rust:
    name: Publish Rust
    needs: versioning
    runs-on: ubuntu-26.04
    steps:
      - name: Check out refreshed version
        uses: actions/checkout@v7
        with:
          ref: "main"
      - name: Pull Git submodules
        run: git submodule update --init --recursive
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Publish to crates.io
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish_java:
    name: Publish Java
    needs:
      [
        versioning,
        build_jni_linux,
        build_jni_windows,
        build_jni_macos,
        build_jni_android,
      ]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      packages: write
    env:
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ORG_GRADLE_PROJECT_signingKey: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGKEY }}
      ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGPASSWORD }}

    steps:
      - name: Check out refreshed version
        uses: actions/checkout@v7
        with:
          ref: "main"
      - name: Pull Git submodules
        run: git submodule update --init --recursive

      - name: Download all JNI libraries
        uses: actions/download-artifact@v8
        with:
          pattern: usearch-jni-*

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "adopt"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build fat JAR with all platforms
        run: |
          # First build the JAR, which will build local native lib
          # and overwrite "build/libs/usearch/shared"
          gradle compileJava processResources

          # Now organize the pre-built JNI libraries to overwrite the local one
          mkdir -p build/libs/usearch/shared/{linux-amd64,linux-arm64,windows-amd64,windows-x86,windows-arm64,darwin-amd64,darwin-arm64,android-arm64,android-arm32}

          # Linux
          cp usearch-jni-linux-amd64/libusearch_java.so build/libs/usearch/shared/linux-amd64/libusearch_java.so || true
          cp usearch-jni-linux-arm64/libusearch_java.so build/libs/usearch/shared/linux-arm64/libusearch_java.so || true

          # Windows
          cp usearch-jni-windows-x64/libusearch_java.dll build/libs/usearch/shared/windows-amd64/libusearch_java.dll || true
          cp usearch-jni-windows-x86/libusearch_java.dll build/libs/usearch/shared/windows-x86/libusearch_java.dll || true
          cp usearch-jni-windows-arm64/libusearch_java.dll build/libs/usearch/shared/windows-arm64/libusearch_java.dll || true

          # macOS
          cp usearch-jni-macos-amd64/libusearch_java.dylib build/libs/usearch/shared/darwin-amd64/libusearch_java.dylib || true
          cp usearch-jni-macos-arm64/libusearch_java.dylib build/libs/usearch/shared/darwin-arm64/libusearch_java.dylib || true

          # Android
          cp usearch-jni-android-arm64/libusearch_java.so build/libs/usearch/shared/android-arm64/libusearch_java.so || true
          cp usearch-jni-android-arm32/libusearch_java.so build/libs/usearch/shared/android-arm32/libusearch_java.so || true

          echo "JNI libraries organized"
          tree build/libs/usearch/shared || find build/libs/usearch/shared -name "libusearch_java.*" | sort

          # Now build the actual fatJar
          gradle fatJar
      - name: Verify fat JAR contents
        run: |
          jar tf build/libs/usearch-*.jar

          # List native libraries found
          echo "Native libraries in fat JAR"
          jar tf build/libs/usearch-*.jar | grep -E "usearch-native.*\.(so|dll|dylib)" || echo "No native libraries found"

          # Count native libraries
          lib_count=$(jar tf build/libs/usearch-*.jar | grep -E "usearch-native.*\.(so|dll|dylib)" | wc -l)
          echo "Found $lib_count native libraries in fat JAR"

          # Just warn if count seems low, don't fail the build
          if [ "$lib_count" -lt 5 ]; then
            echo "::warning::Found fewer native libraries than expected ($lib_count)"
          fi
      - name: Sign and publish fat JAR
        run: gradle signLibraryPublication publish
      - name: Log JAR contents
        run: |
          ls -la build/libs/*.jar
          for jar in build/libs/*.jar; do
            echo "Contents of $jar"
            jar tf "$jar" | grep -E "(usearch-native|\.so|\.dll|\.dylib)" | sort
          done

      - name: Upload Java JAR to GitHub Release
        uses: xresloader/upload-to-github-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          file: "build/libs/*.jar"
          update_latest_release: true

  # SwiftPM resolves the package from the tag `versioning` pushes, downloading the artifacts that release carries, so
  # publishing is proving the tag builds as a consumer's would. The NumKong checkout links the artifact its preset builds.
  publish_swift:
    name: Publish Objective-C & Swift
    needs: versioning
    runs-on: xcode-27
    env:
      NUMKONG_SWIFT_ARTIFACT: build_swift/NumKongC.xcframework
    steps:
      - name: Check out refreshed version
        uses: actions/checkout@v7
        with:
          ref: "main"
      - name: Pull Git submodules
        run: git submodule update --init --recursive
      - name: Build NumKong XCFramework
        working-directory: numkong
        run: |
          cmake --preset swift
          cmake --build --preset swift
      - name: Test Swift
        run: swift test

  # Publishes to both Docker Hub and GitHub Container Registry
  # https://docs.github.com/en/actions/publishing-packages/publishing-docker-images#publishing-images-to-docker-hub-and-github-packages
  publish_docker:
    name: Publish Docker Image
    needs: versioning
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out refreshed version
        uses: actions/checkout@v7
        with:
          ref: "main"
      - name: Pull Git submodules
        run: git submodule update --init --recursive
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Log in to GitHub Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Extract tags & labels for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            unum/usearch
            ghcr.io/${{ github.repository }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build_csharp:
    name: Build C Dependencies for C# on ${{ matrix.os }}
    needs: versioning
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025-vs2026]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out refreshed version
        uses: actions/checkout@v7
        with:
          ref: "main"
      - name: Pull Git submodules
        run: git submodule update --init --recursive

      - name: Build C library for Linux
        if: matrix.os == 'ubuntu-26.04'
        run: |
          sudo apt update
          sudo apt install -y build-essential libjemalloc-dev libomp-dev
          cmake --preset library -B build_artifacts -D USEARCH_WITH_JEMALLOC=1
          cmake --build build_artifacts
          mkdir -p "${{ github.workspace }}/csharp/lib/runtimes/linux-x64/native"
          cp "${{ github.workspace }}/build_artifacts/libusearch_shared.so" "${{ github.workspace }}/csharp/lib/runtimes/linux-x64/native"

      - name: Build C library for MacOS
        if: matrix.os == 'macos-26'
        run: |
          cmake --preset library -B build_artifacts
          cmake --build build_artifacts
          mkdir -p "${{ github.workspace }}/csharp/lib/runtimes/osx-arm64/native"
          cp "${{ github.workspace }}/build_artifacts/libusearch_shared.dylib" "${{ github.workspace }}/csharp/lib/runtimes/osx-arm64/native"

      - name: Build C library for Windows
        if: matrix.os == 'windows-2025-vs2026'
        run: |
          cmake --preset msvc2026_x64 -B build_artifacts -D USEARCH_BUILD_TEST=0
          cmake --build build_artifacts --config Release
          mkdir -p "${{ github.workspace }}\csharp\lib\runtimes\win-x64\native"
          cp "${{ github.workspace }}\build_artifacts\libusearch_shared.dll" "${{ github.workspace }}\csharp\lib\runtimes\win-x64\native"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: usearch-csharp-dependencies-${{ matrix.os }}
          path: ${{ github.workspace }}/csharp/lib/**/*

  publish_csharp:
    name: Publish C#
    runs-on: ubuntu-26.04
    needs: [build_csharp]
    env:
      SOLUTION: ${{ github.workspace }}/csharp
      USEARCH_LIBS: ${{ github.workspace }}/csharp/lib
      NUGET_PACKAGES: ${{ github.workspace }}/csharp/packages
      # NUGET_SOURCE: https://apiint.nugettest.org/v3/index.json
      NUGET_SOURCE: https://api.nuget.org/v3/index.json
      GITHUB_PACKAGES_SOURCE: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
    steps:
      - name: Check out refreshed version
        uses: actions/checkout@v7
        with:
          ref: "main"
      - name: Pull Git submodules
        run: git submodule update --init --recursive

      - name: Download usearch libs artifact
        uses: actions/download-artifact@v8
        with:
          pattern: usearch-csharp-dependencies-*
          merge-multiple: true
          path: ${{ env.USEARCH_LIBS }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Pack project
        run: |
          dotnet pack "${{ env.SOLUTION }}" -c Release --output ${{ env.NUGET_PACKAGES }}
        working-directory: ${{ github.workspace }}

      - name: Publish to NuGet
        run: dotnet nuget push "${{ env.NUGET_PACKAGES }}/*.nupkg" --api-key "${{ secrets.NUGET_API }}" --source "${{ env.NUGET_SOURCE }}" --skip-duplicate

      - name: Prepare publish to GitHub Registry
        run: dotnet nuget add source --username ${{ github.repository_owner }} --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --name github "${{ env.GITHUB_PACKAGES_SOURCE }}"

      - name: Publish to GitHub Registry
        run: dotnet nuget push "${{ env.NUGET_PACKAGES }}/*.nupkg"  --api-key "${{ secrets.GITHUB_TOKEN }}" --source "github" --skip-duplicate

  build_docs:
    name: Build Docs
    runs-on: ubuntu-26.04
    if: ${{ always() }}
    needs:
      [
        publish_python,
        publish_javascript,
        publish_rust,
        publish_java,
        publish_swift,
        publish_docker,
        publish_csharp,
      ]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: "main"
      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install Doxygen
        run: |
          curl -sSfL https://www.doxygen.nl/files/doxygen-1.18.0.linux.bin.tar.gz | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/doxygen-1.18.0/bin" >> "$GITHUB_PATH"
      - name: Install Sphinx
        run: pip install -r docs/requirements.txt
      - name: Install the Released USearch
        run: pip install "usearch==$(cat VERSION)"
      - name: Build Docs
        run: cd docs && doxygen conf.dox && sphinx-build -M html . ../build/docs -W
      - name: Compress Docs
        run: tar -czf docs.tar.gz build/docs/html/
      - name: Upload docs to release
        uses: xresloader/upload-to-github-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          file: docs.tar.gz
          update_latest_release: true

  deploy_docs_pages:
    name: Deploy GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-26.04
    if: ${{ always() }}
    needs: build_docs
    steps:
      - name: Download release assets
        uses: robinraju/release-downloader@v1.13
        with:
          latest: true
          fileName: docs.tar.gz
      - name: Unpack docs
        run: tar -xf ./docs.tar.gz
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload artifacts
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./build/docs/html
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  deploy_docs_vercel:
    name: Deploy Vercel
    runs-on: ubuntu-26.04
    if: ${{ always() }}
    needs: build_docs
    steps:
      - name: Notify Vercel
        uses: fjogeleit/http-request-action@v2
        with:
          url: ${{ secrets.DOCS_VERCEL }}
          method: "POST"
