# This file configures wheels compilation for `cibuilwheel` for USearch CPython bindings.
# On a good day it will produce:
#   - `macos` wheels for x86_64, arm64, and universal2;
#   - `windows` wheels for AMD64, and ARM64. But not x86.
#   - `manylinux` and `musllinux` wheels for Linux on x86_64, aarch64. But not i686, ppc64le, s390x;
#   * for CPython versions from 3.12 to 3.14 (including free-threaded 3.13t and 3.14t).
#   = meaning 7 platforms * 5 Python versions = 35 builds.
[build-system]
build-backend = "scikit_build_core.build"
requires = ["scikit-build-core>=0.10"]

[project]
name = "usearch"
description = "Billion-Scale Multi-Modal Search, Clustering, & Sparse Algebra Engine for CPUs, GPUs, & NVMe Devices"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dynamic = ["version"]
authors = [{ name = "Ash Vardanian", email = "info@unum.cloud" }]
keywords = [
  "vector-search",
  "vector-database",
  "similarity-search",
  "nearest-neighbors",
  "embeddings",
  "semantic-search",
  "retrieval",
  "clustering",
  "simd",
  "gpu",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Natural Language :: English",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Free Threading :: 3 - Stable",
  "Programming Language :: Java",
  "Programming Language :: JavaScript",
  "Programming Language :: Rust",
  "Programming Language :: Other",
  "Operating System :: MacOS",
  "Operating System :: Unix",
  "Operating System :: Microsoft :: Windows",
  "Topic :: System :: Clustering",
  "Topic :: Database :: Database Engines/Servers",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
# None. CMake compiles the siblings from their own sources into the extension, so the wheel is
# self-contained: batch inputs arrive through the buffer protocol, which is CPython's own, and
# NumPy is a convenience of `usearch.eval` and of the suite rather than of the index.
dependencies = []

[project.optional-dependencies]
eval = ["numpy", "tqdm"]

[project.urls]
Homepage = "https://github.com/unum-cloud/USearch"

# One CMake tree serves the compiler flags, the instantiation grid and the release artifacts, so the
# SDK has one native build rather than a second one described in a `setup.py`.
[tool.scikit-build]
build-dir = "build_python/{wheel_tag}"
build.targets = ["usearch_python"]
install.components = ["usearch_python"]
cmake.version = ">=3.28"
minimum-version = "build-system.requires"
wheel.packages = ["python/usearch"]

[tool.scikit-build.cmake.define]
USEARCH_BUILD_PYTHON = "ON"
USEARCH_DENSE_DTYPES = "11"

# `VERSION` is what every other SDK reads, so the wheel takes its version from the same file rather
# than from a second copy that drifts.
[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "VERSION"
regex = "(?P<value>.+)"

[tool.pytest.ini_options]
# `-p no:randomly` keeps `<PROJECT>_SEED` in charge wherever pytest-randomly happens to be installed.
addopts = ["-ra", "--showlocals", "--strict-markers", "--strict-config", "-p", "no:randomly"]
filterwarnings = ["error"]
minversion = "8.0"
python_files = ["*.py"]
testpaths = ["test"]
xfail_strict = true

[tool.cibuildwheel]
build-verbosity = 0
test-command = "python -X faulthandler -m pytest -x {project}/test"
test-groups = ["test"]

# Add "pp*" to skip PyPy builds, but they should work fine these days :)
# https://cibuildwheel.readthedocs.io/en/stable/options/#build-skip
# https://cibuildwheel.readthedocs.io/en/stable/#what-does-it-do
skip = []

[tool.cibuildwheel.linux]
archs = ["x86_64", "aarch64"]
before-build = [
  "rm -rf {project}/CMakeCache.txt {project}/build {project}/build_debug {project}/CMakeFiles.txt {project}/_deps {project}/.pytest_cache",
  "mkdir -p build/usearch",
  "git submodule update --init --recursive",
]
repair-wheel-command = "auditwheel repair --lib-sdir . -w {dest_dir} {wheel}"

# Use more recent images for the most popular SIMD-capable CPU architectures, to have access to newer compilers.
# Otherwise, prepare yourself to all kinds of AVX-512 issues and other SIMD-related pain.
# You can keep track of the most recent images on Quay:
# - for `manylinux`: https://quay.io/search?q=manylinux
# - for `musllinux`: https://quay.io/search?q=musllinux
manylinux-aarch64-image = "manylinux_2_28"
manylinux-x86_64-image = "manylinux_2_28"
musllinux-aarch64-image = "musllinux_1_2"
musllinux-x86_64-image = "musllinux_1_2"

# On CentOS we have to use `yum`.
# The healthy version would be: `apt-get update && apt-get install -y libc6-dev wget python3-dev`.
before-all = [
  "yum update -y --disablerepo=extras --setopt=install_weak_deps=0 && yum install -y --disablerepo=extras glibc-devel wget python3-devel",
]

# With `musl` builds, we obviously don't need the `glibc` and can't use `yum`.
# This may also be handy for using custom dependencies for different Python versions:
# https://cibuildwheel.readthedocs.io/en/stable/options/#overrides
[[tool.cibuildwheel.overrides]]
before-all = "apk add --update wget python3-dev"
select = "*-musllinux*"

[tool.cibuildwheel.macos]
archs = ["x86_64", "universal2", "arm64"]
before-build = [
  "rm -rf {project}/CMakeCache.txt {project}/build {project}/build_debug {project}/CMakeFiles.txt {project}/_deps {project}/.pytest_cache",
  "mkdir -p build/usearch",
  "git submodule update --init --recursive",
  "export CC=$(echo CXX)",
]
repair-wheel-command = "delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}"

[tool.cibuildwheel.windows]
archs = ["AMD64", "ARM64"]
before-build = [
  "rd /s /q {project}\\CMakeCache.txt {project}\\build {project}\\build_debug {project}\\CMakeFiles.txt {project}\\_deps {project}\\.pytest_cache || echo Done",
  "md build\\usearch",
  "git submodule update --init --recursive",
]

# Groups rather than extras, so none of this reaches the published wheel's metadata.
[dependency-groups]
lint = ["ruff>=0.15.8"]
# NumKong is what `usearch.eval` computes the exact neighbors with.
test = ["numkong>=8.0.0-rc.1", "numpy>=1.21", "pytest>=8", "pytest-repeat>=0.9.4"]
# Free-threaded builds only report a race if several threads actually enter the extension at once.
test-parallel = ["pytest-run-parallel>=0.7"]
# The reference the recall checks score against, and the progress bar the sweeps in `eval` print.
test-oracles = ["scipy>=1.11", "tqdm>=4.66"]
# CuPy is the device-buffer producer, exercising `__cuda_array_interface__` against a VRAM-resident
# index. Not an oracle - the recall reference stays SciPy's, on the host.
test-cuda = ["cupy-cuda12x"]

[tool.ruff]
# Code wraps at 120; prose - docstrings and comments - wraps at 100.
line-length = 120
target-version = "py312"

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort (import ordering)
  "UP",  # pyupgrade (modernize syntax)
  "YTT", # flake8-2020 (misreading `sys.version` and friends)
  "B",   # flake8-bugbear (likely bugs)
  "SIM", # flake8-simplify (needless complexity)
  "TID", # flake8-tidy-imports (relative imports)
  "D",   # pydocstyle (docstrings)
]
ignore = [
  "E501",  # line too long (handled by formatter)
  "E741",  # ambiguous variable names (l, O, I)
  "UP007", # Union[X, Y] -> X | Y (deferred to v3, requires annotation refactor)
]

[tool.ruff.lint.per-file-ignores]
"python/usearch/__init__.py" = [
  "F401",
  "E402",
] # re-exports and conditional imports
".cmake-format.py" = ["F821"] # cmake-format defines `section` when it runs the profile
"!python/**" = ["D"]
"*.pyi" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["usearch"]
# A stub re-exports with `X as X`, which isort otherwise gives a statement apiece - thirty lines
# where two say the same thing.
combine-as-imports = true
