[package]
authors = ["Ash Vardanian <info@unum.cloud>"]
description = "Billion-Scale Multi-Modal Search, Clustering, & Sparse Algebra Engine for CPUs, GPUs, & NVMe Devices"
keywords = ["vector-search", "vector-database", "similarity-search", "embeddings", "nearest-neighbor"]
documentation = "https://unum-cloud.github.io/USearch"
edition = "2021"
rust-version = "1.100"
include = [
  "/rust/**",
  "/include/**",
  "/src/**",
  "/c/**",
  "/cmake/**",
  "/CMakeLists.txt",
  "/build.rs",
]
license = "Apache-2.0"
name = "usearch"
publish = true
repository = "https://github.com/unum-cloud/USearch"
version = "3.0.0-rc.1"

[lib]
name = "usearch"
path = "rust/lib.rs"

[dependencies]
# Pinned to the same revision as the submodule and CMake.
numkong = { git = "https://github.com/ashvardanian/NumKong", rev = "215377db8fc434fe96e3d548d416670cbafc6198" }

# Which implementation of the C interface gets linked. Each is a whole implementation rather than
# a knob on one, so they are mutually exclusive and `build.rs` refuses a pair rather than choosing.
#
# Naming neither links the engine as a self-contained archive. That default is deliberately not a
# feature: Cargo unions features across the dependency graph and never subtracts, so a `static`
# name could only be turned off by every consumer at once, and one no code reads would do nothing.
[features]
# The engine with its CUDA backends compiled in; needs a toolkit at build time.
cuda = []
# The brute-force stand-in, which answers the same verbs over the standard library alone -
# seconds to build, exact search, and no submodules. For testing a caller, never for shipping.
stub = []

[build-dependencies]
# The engine is CMake's to build - `build.rs` drives it rather than restating the instantiation
# grid and the per-target flags in Rust.
cmake = "0.1"

[dev-dependencies]
rand = "0.10"
rand_chacha = "0.10" # reproducible across platforms, unlike the thread generator
