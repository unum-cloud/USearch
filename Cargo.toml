[package]
authors = ["Ash Vardanian <info@unum.cloud>"]
description = "One Proximity Graph for Search, Sparse Products & Attention across RAM, VRAM & NVMe"
keywords = ["vector-search", "sequence-search", "shape-search", "geospatial-search", "nearest-neighbor"]
edition = "2024"
rust-version = "1.100"
include = [
  "/rust/**",
  "/include/**",
  "/src/**",
  "/c/**",
  "/cpp/**",
  "/cmake/**",
  "/CMakeLists.txt",
  "/build.rs",
]
license = "Apache-2.0"
name = "usearch"
links = "usearch"
publish = true
homepage = "https://www.unum.cloud/docs/usearch"
repository = "https://github.com/unum-cloud/USearch"
documentation = "https://www.unum.cloud/docs/usearch/rust"
version = "3.0.0-rc.1"

[lib]
name = "usearch"
path = "rust/lib.rs"

[dependencies]
# Each `rev` is the one `cmake/usearch_siblings.cmake` pins, so the crates and the C library hold one
# copy of every sibling; CMake builds each crate's tree in place of downloading it again.
forkunion = { version = "4.0.0-rc.1", git = "https://github.com/ashvardanian/ForkUnion", rev = "6bd10ce124b3804719ca297ac61092ac5773d627", default-features = false }
numkong = { version = "8.0.0-rc.1", git = "https://github.com/ashvardanian/NumKong", rev = "0d4115072efd2f8cb93c1c16e095742a9d5cccdf" }
smashtable = { version = "1.0.0-rc.1", git = "https://github.com/ashvardanian/SmashTable", rev = "09caec7b2084dd20a6563c8f0e87448eebf90d43" }
stringzilla = { version = "6.0.0-rc.1", git = "https://github.com/ashvardanian/StringZilla", rev = "a01d3e34da6049b871e3d647333688e216325f1b", default-features = false }

# Which implementation of the C interface gets linked. Each is a whole implementation rather than
# a knob on one, so they are mutually exclusive and `build.rs` refuses a pair rather than choosing.
#
# Naming neither links the engine as a self-contained archive. That default is deliberately not a
# feature: Cargo unions features across the dependency graph and never subtracts, so a `static`
# name could only be turned off by every consumer at once, and one no code reads would do nothing.
[features]
# The engine with its CUDA backends compiled in; needs a toolkit at build time.
cuda = []
# The brute-force stand-in, which answers the same verbs over the standard library alone -
# seconds to build, exact search, and no submodules. For testing a caller, never for shipping.
stub = []

[build-dependencies]
# The engine is CMake's to build - `build.rs` drives it rather than restating the instantiation
# grid and the per-target flags in Rust.
cmake = "0.1"

[dev-dependencies]
rand = "0.10"
rand_chacha = "0.10" # reproducible across platforms, unlike the thread generator
