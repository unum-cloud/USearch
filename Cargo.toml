[package]
authors = ["Ash Vardanian <1983160+ashvardanian@users.noreply.github.com>"]
description = "Smaller & Faster Single-File Vector Search Engine from Unum"
documentation = "https://unum-cloud.github.io/USearch"
edition = "2021"
include = [
  "/rust/**",
  "/include/**",
  "/c/**",
  "/src/**",
  "/build.rs",
]
license = "Apache-2.0"
name = "usearch"
publish = true
repository = "https://github.com/unum-cloud/USearch"
version = "3.0.0"

[lib]
name = "usearch"
path = "rust/lib.rs"

[dependencies]
# NumKong is not optional and not merely a build input: its matrices, scalar types, and traits
# are the crate's public vocabulary, and `build.rs` links the SIMD kernels it compiles. For local
# NumKong development, add a `[patch.crates-io]` override in your personal `.cargo/config.toml`
# rather than editing this file.
numkong = ">=7.7.0"

[build-dependencies]
cc = {version = "1.2.36", features = ["parallel"]}

[dev-dependencies]
# The concurrency tests drive the index from outside through ForkUnion's pool, the same
# scheduler the library uses internally. Version 3 matches the `forkunion/` submodule and the
# sibling crates; its `spawn` takes a `&Topology`, which version 2 had no notion of.
forkunion = "3.0"
rand = "0.10"
rand_chacha = "0.10" # reproducible across platforms, unlike the thread generator
