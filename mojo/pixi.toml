# The Mojo binding, which `dlopen`s the engine rather than linking it - so `usearch` is a run dependency, and a
# consumer naming this package by `git` or `path` needs no linker flags of its own.

[package]
authors = ["Ash Vardanian <info@unum.cloud>"]
description = "One Proximity Graph for Search, Sparse Products & Attention across RAM, VRAM & NVMe"
documentation = "https://www.unum.cloud/docs/usearch/mojo"
homepage = "https://www.unum.cloud/docs/usearch"
license = "Apache-2.0"
name = "usearch_mojo"
repository = "https://github.com/unum-cloud/USearch"
version = "3.0.0-rc.1"

[package.build]
backend = { name = "pixi-build-mojo", version = "0.*" }

# The backend only auto-discovers a package under `<name>/` or `src/`, and this one lives under
# `usearch/`, so it is named here.
[package.build.config]
pkg = { name = "usearch", path = "usearch" }

[package.run-dependencies]
usearch = { path = ".." }
